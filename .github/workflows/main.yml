name: Build Kernel for judyln with Droidspaces

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Defconfig name'
        required: false
        default: 'lineageos_judyln_defconfig'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'lineage-22.2'

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CONFIG_NAME: ${{ github.event.inputs.config_name || 'lineageos_judyln_defconfig' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /share || true
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: coldraintea/android_kernel_lge_sdm845
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            libelf-dev dwarves xz-utils rsync python3-distutils python3 \
            git make gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler cpio lz4 gcc-arm-linux-gnueabi clang llvm

      - name: Setup toolchain (Clang)
        run: |
          mkdir -p toolchain
          git clone --depth=1 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            toolchain/clang -b 17

      - name: Setup toolchain (GCC)
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/gcc
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain/gcc32

      - name: Apply cgroup prefix handling patch
        working-directory: kernel
        run: |
            patch -p1 < 02.fix_restore_cgroup_file_prefix_handling.patch

      - name: Apply Droidspaces kernel config
        working-directory: kernel
        run: |
          # 合并到 defconfig根据实际 defconfig 名称调整
          DEFCONFIG_NAME="${CONFIG_NAME}"
          # 如果输入只是文件名例如 lineageos_judyln_defconfig尝试多个路径
          if [ -f "arch/arm64/configs/${DEFCONFIG_NAME}" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG_NAME}"
          elif [ -f "arch/arm64/configs/${DEFCONFIG_NAME}_defconfig" ]; then
            DEFCONFIG_PATH="arch/arm64/configs/${DEFCONFIG_NAME}_defconfig"
          else
            # 尝试直接使用 sdm845_defconfig 作为回退
            DEFCONFIG_PATH="arch/arm64/configs/sdm845_defconfig"
          fi

          echo "Appending droidspaces.cfg to $DEFCONFIG_PATH"
          cat droidspaces.cfg >> "$DEFCONFIG_PATH"
          echo "✅ Droidspaces config appended to $DEFCONFIG_PATH"

      - name: Build kernel (single-thread, verbose) and capture logs
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-android-
          CROSS_COMPILE_ARM32: arm-linux-androideabi-
          CC: clang
          CLANG_TRIPLE: aarch64-linux-android-
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          echo "=== ENV ==="
          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CC=$(command -v ${CC} || true)"
          ${CC} --version || true
          echo "${CROSS_COMPILE}gcc: $(command -v ${CROSS_COMPILE}gcc || true)"
          ${CROSS_COMPILE}gcc --version || true

          mkdir -p buildlogs

          # 生成 config
          echo "Generating defconfig and merging droidspaces.cfg"
          make O=out ARCH=${ARCH} ${CONFIG_NAME} > build-config.log 2>&1 || (tail -n 200 build-config.log && true)
          scripts/kconfig/merge_config.sh -O out out/.config droidspaces.cfg >> build-config.log 2>&1 || (tail -n 200 build-config.log && true)
          make O=out ARCH=${ARCH} olddefconfig >> build-config.log 2>&1 || (tail -n 200 build-config.log && true)

          # 单线程详细编译以抓取第一个失败命令
          echo "Starting single-threaded verbose build (V=1)"
          set +e
          make -j1 O=out ARCH=${ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            CC=${CC} \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            Image.gz dtbo.img V=1 2>&1 | tee buildlogs/build-single.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          # 保存构建日志
          cp buildlogs/build-single.log ../artifacts/logs/ 2>/dev/null || true
          cp build-config.log ../artifacts/logs/ 2>/dev/null || true

          # 检查日志中的错误关键词
          if grep -E "fatal error:|error:|internal compiler error|segmentation fault|undefined reference" -n buildlogs/build-single.log | head -n 50; then
            echo "Build failed during single-threaded step. See buildlogs/build-single.log"
            tail -n 400 buildlogs/build-single.log || true
            exit ${BUILD_EXIT}
          fi

          echo "Single-threaded build succeeded; attempting parallel build"
          make -j$(nproc) O=out ARCH=${ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            CC=${CC} \
            CLANG_TRIPLE=${CLANG_TRIPLE} \
            Image.gz dtbo.img 2>&1 | tee buildlogs/build-parallel.log || true

          cp buildlogs/build-parallel.log ../artifacts/logs/ 2>/dev/null || true

      - name: Prepare artifacts
        working-directory: kernel
        run: |
              mkdir -p artifacts
              mkdir -p artifacts/logs
              cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
              cp out/arch/arm64/boot/dtbo.img artifacts/ 2>/dev/null || true
              cp out/arch/arm64/boot/dts/qcom/*.dtb artifacts/ 2>/dev/null || true
              cp out/.config artifacts/config 2>/dev/null || true
              cp -r ../artifacts/logs/* artifacts/logs/ 2>/dev/null || true
              echo "✅ Artifacts prepared in kernel/artifacts/"
    
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
              name: kernel-judyln-droidspaces
              path: kernel/artifacts/
              retention-days: 7
    
      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
              name: kernel-make-log
              path: kernel/artifacts/logs/
              retention-days: 7
    
      - name: Create release package
        if: github.event_name == 'push' || github.ref_type == 'tag'
        working-directory: kernel/artifacts
        run: |
              zip -r ../kernel-judyln-droidspaces.zip .
              echo "✅ Release package created"
    
      - name: Upload to Release
        if: github.event_name == 'push' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
              files: kernel/kernel-judyln-droidspaces.zip
              tag_name: ${{ github.ref_name }}
              draft: false
              prerelease: true
        env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
