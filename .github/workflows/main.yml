name: Build Android Kernel

on:
  workflow_dispatch:

  push:
    branches:
      - lineage-22.2

  pull_request:
    branches:
      - lineage-22.2

permissions:
  contents: read

env:
  ARCH: arm64

  KERNEL_DIR: ${{ github.workspace }}
  OUT_DIR: ${{ github.workspace }}/out

  CLANG_DIR: ${{ github.workspace }}/toolchain/clang
  GCC64_DIR: ${{ github.workspace }}/toolchain/gcc
  GCC32_DIR: ${{ github.workspace }}/toolchain/gcc32

  CROSS_COMPILE: ${{ github.workspace }}/toolchain/gcc/bin/aarch64-linux-android-
  CROSS_COMPILE_ARM32: ${{ github.workspace }}/toolchain/gcc32/bin/arm-linux-androideabi-

  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-

  DEFCONFIG: lineageos_judyln_defconfig


jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # Checkout kernel
      # =========================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-22.2
          fetch-depth: 1
          submodules: false


      # =========================================================
      # Install dependencies
      # =========================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            cpio \
            python3 \
            python3-pip \
            python3-setuptools \
            lz4 \
            dwarves \
            rsync \
            unzip \
            zip \
            wget \
            curl \
            ca-certificates \
            file \
            xz-utils


      # =========================================================
      # Prepare directories
      # =========================================================

      - name: Prepare directories
        run: |
          set -eux

          rm -rf \
            "${CLANG_DIR}" \
            "${GCC64_DIR}" \
            "${GCC32_DIR}" \
            "${OUT_DIR}"

          mkdir -p \
            "${CLANG_DIR}" \
            "${GCC64_DIR}" \
            "${GCC32_DIR}" \
            "${OUT_DIR}"


      # =========================================================
      # Download Android Clang r383902
      #
      # Android 11
      # Clang 11.0.1
      #
      # Use archive instead of git clone.
      # This avoids annotated-tag shallow-clone problems.
      # =========================================================

      - name: Download Android Clang r383902
        run: |
          set -eux

          rm -rf clang-src
          mkdir -p clang-src

          cd clang-src

          curl -L \
            --retry 5 \
            --retry-delay 3 \
            --fail \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r1.tar.gz"

          tar -xzf clang.tar.gz

          echo "Checking Clang r383902..."

          test -d clang-r383902
          test -d clang-r383902/bin
          test -x clang-r383902/bin/clang

          cp -a \
            clang-r383902/. \
            "${CLANG_DIR}/"

          test -x "${CLANG_DIR}/bin/clang"
          test -x "${CLANG_DIR}/bin/clang++"
          test -x "${CLANG_DIR}/bin/ld.lld"

          echo
          echo "========================================"
          echo "Clang version"
          echo "========================================"

          "${CLANG_DIR}/bin/clang" --version

          echo
          echo "========================================"
          echo "Clang path"
          echo "========================================"

          ls -lh "${CLANG_DIR}/bin/clang"


      # =========================================================
      # Download AArch64 GCC 4.9
      #
      # IMPORTANT:
      #
      # Do NOT use:
      #
      # git clone --depth=1 --branch android-11.0.0_r1
      #
      # because the AOSP tag is annotated.
      #
      # Use Gitiles archive of:
      #
      # android-mainline-11.0.0_r1
      #
      # This tag contains:
      #
      # bin/
      # lib/
      # libexec/
      # aarch64-linux-android/
      #
      # =========================================================

      - name: Download AArch64 GCC 4.9
        run: |
          set -eux

          rm -rf gcc64-src
          mkdir -p gcc64-src

          cd gcc64-src

          curl -L \
            --retry 5 \
            --retry-delay 3 \
            --fail \
            -o gcc64.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-mainline-11.0.0_r1.tar.gz"

          tar -xzf gcc64.tar.gz

          echo
          echo "========================================"
          echo "Checking AArch64 GCC"
          echo "========================================"

          test -d bin
          test -d lib
          test -d libexec
          test -d aarch64-linux-android

          test -x bin/aarch64-linux-android-gcc
          test -x bin/aarch64-linux-android-g++

          rm -rf "${GCC64_DIR}"
          mkdir -p "${GCC64_DIR}"

          cp -a . "${GCC64_DIR}/"

          test -x "${GCC64_DIR}/bin/aarch64-linux-android-gcc"
          test -x "${GCC64_DIR}/bin/aarch64-linux-android-g++"

          echo
          echo "========================================"
          echo "AArch64 GCC version"
          echo "========================================"

          "${GCC64_DIR}/bin/aarch64-linux-android-gcc" --version

          echo
          echo "AArch64 GCC:"
          ls -lh "${GCC64_DIR}/bin/aarch64-linux-android-gcc"


      # =========================================================
      # Download ARM32 GCC 4.9
      #
      # Also use Gitiles archive.
      # =========================================================

      - name: Download ARM32 GCC 4.9
        run: |
          set -eux

          rm -rf gcc32-src
          mkdir -p gcc32-src

          cd gcc32-src

          curl -L \
            --retry 5 \
            --retry-delay 3 \
            --fail \
            -o gcc32.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-mainline-11.0.0_r1.tar.gz"

          tar -xzf gcc32.tar.gz

          echo
          echo "========================================"
          echo "Checking ARM32 GCC"
          echo "========================================"

          test -d bin
          test -d lib
          test -d libexec
          test -d arm-linux-androideabi

          test -x bin/arm-linux-androideabi-gcc
          test -x bin/arm-linux-androideabi-g++

          rm -rf "${GCC32_DIR}"
          mkdir -p "${GCC32_DIR}"

          cp -a . "${GCC32_DIR}/"

          test -x "${GCC32_DIR}/bin/arm-linux-androideabi-gcc"
          test -x "${GCC32_DIR}/bin/arm-linux-androideabi-g++"

          echo
          echo "========================================"
          echo "ARM32 GCC version"
          echo "========================================"

          "${GCC32_DIR}/bin/arm-linux-androideabi-gcc" --version

          echo
          echo "ARM32 GCC:"
          ls -lh "${GCC32_DIR}/bin/arm-linux-androideabi-gcc"


      # =========================================================
      # Configure PATH
      # =========================================================

      - name: Configure toolchain PATH
        run: |
          set -eux

          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"
          echo "${GCC64_DIR}/bin" >> "${GITHUB_PATH}"
          echo "${GCC32_DIR}/bin" >> "${GITHUB_PATH}"

          echo "Toolchain PATH configured."


      # =========================================================
      # Verify all toolchains
      # =========================================================

      - name: Verify toolchains
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          echo
          echo "========================================"
          echo "CLANG"
          echo "========================================"

          command -v clang
          clang --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          command -v ld.lld
          ld.lld --version

          echo
          echo "========================================"
          echo "AARCH64 GCC"
          echo "========================================"

          command -v aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

          echo
          echo "========================================"
          echo "ARM32 GCC"
          echo "========================================"

          command -v arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version

          echo
          echo "========================================"
          echo "TOOLCHAIN FILES"
          echo "========================================"

          test -x "${CLANG_DIR}/bin/clang"
          test -x "${CLANG_DIR}/bin/ld.lld"

          test -x "${GCC64_DIR}/bin/aarch64-linux-android-gcc"
          test -x "${GCC64_DIR}/bin/aarch64-linux-android-g++"

          test -x "${GCC32_DIR}/bin/arm-linux-androideabi-gcc"
          test -x "${GCC32_DIR}/bin/arm-linux-androideabi-g++"

          echo
          echo "All toolchains are OK."


      # =========================================================
      # Check kernel source
      # =========================================================

      - name: Check kernel source
        run: |
          set -eux

          echo
          echo "Kernel source:"
          pwd

          test -f Makefile
          test -f Kconfig

          echo
          echo "Checking defconfig..."

          test -f \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "Using:"
          echo "arch/arm64/configs/${DEFCONFIG}"


      # =========================================================
      # Generate defconfig
      # =========================================================

      - name: Generate kernel defconfig
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          make \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            "${DEFCONFIG}"

          test -f "${OUT_DIR}/.config"

          echo
          echo "Defconfig generated."

          wc -l "${OUT_DIR}/.config"


      # =========================================================
      # Merge droidspaces.cfg
      # =========================================================

      - name: Merge droidspaces configuration
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          if [ -f droidspaces.cfg ]; then

            echo "Found droidspaces.cfg"

            scripts/kconfig/merge_config.sh \
              -O "${OUT_DIR}" \
              "${OUT_DIR}/.config" \
              droidspaces.cfg

            make \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              olddefconfig

          else

            echo "droidspaces.cfg not found."
            echo "Skipping droidspaces configuration."

          fi

          test -f "${OUT_DIR}/.config"


      # =========================================================
      # Show important config
      # =========================================================

      - name: Show kernel configuration
        run: |
          set -eux

          echo
          echo "========================================"
          echo "IMPORTANT CONFIG"
          echo "========================================"

          grep -E \
            '^(CONFIG_ARM64|CONFIG_MODULES|CONFIG_KALLSYMS|CONFIG_LTO|CONFIG_CC_IS_CLANG|CONFIG_LD_IS_LLD|CONFIG_BUILD_ARM64_DT_OVERLAY)' \
            "${OUT_DIR}/.config" || true


      # =========================================================
      # Build Image.gz
      #
      # LLVM_IAS intentionally disabled for the first test.
      # =========================================================

      - name: Build Image.gz
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-"

          echo
          echo "========================================"
          echo "BUILDING IMAGE.GZ"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-" \
            Image.gz

          test -f \
            "${OUT_DIR}/arch/arm64/boot/Image.gz"

          echo
          echo "Image.gz successfully built."

          ls -lh \
            "${OUT_DIR}/arch/arm64/boot/Image.gz"


      # =========================================================
      # Build DTBs
      # =========================================================

      - name: Build DTBs
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-"

          echo
          echo "========================================"
          echo "BUILDING DTBS"
          echo "========================================"

          make \
            -j"$(nproc)" \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-" \
            dtbs

          echo
          echo "DTB files:"

          find \
            "${OUT_DIR}/arch/arm64/boot/dts" \
            -type f \
            -name "*.dtb" \
            -print || true


      # =========================================================
      # Build DTBO
      # =========================================================

      - name: Build DTBO
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-"

          if grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' \
            "${OUT_DIR}/.config"; then

            echo "DT overlay support enabled."

            make \
              -j"$(nproc)" \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-" \
              CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-" \
              dtbo.img

          else

            echo "DT overlay support disabled."
            echo "Skipping DTBO."

          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" ]; then

            echo
            echo "DTBO generated:"
            ls -lh \
              "${OUT_DIR}/arch/arm64/boot/dtbo.img"

          else

            echo
            echo "No dtbo.img generated."

          fi


      # =========================================================
      # Prepare release files
      # =========================================================

      - name: Prepare release
        if: success()
        run: |
          set -eux

          rm -rf release

          mkdir -p \
            release \
            release/dtb

          # Image.gz

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then

            cp \
              "${OUT_DIR}/arch/arm64/boot/Image.gz" \
              release/Image.gz

          fi

          # Image

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then

            cp \
              "${OUT_DIR}/arch/arm64/boot/Image" \
              release/Image

          fi

          # DTBO

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" ]; then

            cp \
              "${OUT_DIR}/arch/arm64/boot/dtbo.img" \
              release/dtbo.img

          fi

          # DTBs

          find \
            "${OUT_DIR}/arch/arm64/boot/dts" \
            -type f \
            -name "*.dtb" \
            -exec cp {} release/dtb/ \; || true

          echo
          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          find release \
            -type f \
            -exec ls -lh {} \;


      # =========================================================
      # Upload kernel
      # =========================================================

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # Upload build output on failure
      # =========================================================

      - name: Upload failure information
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-failure-${{ github.sha }}
          path: |
            out/.config
            out/.config.old
            out/include/config/
            out/arch/arm64/boot/
          if-no-files-found: ignore
          retention-days: 7
