name: Build Kernel for judyln with Droidspaces

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Defconfig name'
        required: false
        default: 'lineageos_judyln_defconfig'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'lineage-22.2'

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CONFIG_NAME: ${{ github.event.inputs.config_name || 'lineageos_judyln_defconfig' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /share || true
          df -h

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: coldraintea/android_kernel_lge_sdm845
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libncurses-dev \
            libelf-dev dwarves xz-utils rsync python3-distutils python3 \
            git make gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler cpio lz4 gcc-arm-linux-gnueabi clang llvm

      - name: Setup toolchain (Clang 11.0.1)
        run: |
          mkdir -p toolchain
          # 克隆官方 Clang 预编译仓库
          git clone --depth=1 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            toolchain/clang -b 11
          chmod -R +x toolchain/clang/bin
          echo "=== Clang bin contents ==="
          ls toolchain/clang/bin | head

      - name: Setup toolchain (GCC 4.9)
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/gcc
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain/gcc32
          
          echo "=== Contents of toolchain/gcc ==="
          ls -la toolchain/gcc
          echo "=== Contents of toolchain/gcc32 ==="
          ls -la toolchain/gcc32

          if [ -d toolchain/gcc/bin ]; then
            chmod -R +x toolchain/gcc/bin
          else
            echo "ERROR: toolchain/gcc/bin not found!"
            exit 1
          fi

          if [ -d toolchain/gcc32/bin ]; then
            chmod -R +x toolchain/gcc32/bin
          else
            echo "ERROR: toolchain/gcc32/bin not found!"
            exit 1
          fi

      - name: Apply cgroup prefix handling patch
        working-directory: kernel
        run: |
          if [ -f 02.fix_restore_cgroup_file_prefix_handling.patch ]; then
            patch -p1 < 02.fix_restore_cgroup_file_prefix_handling.patch
          else
            echo "Patch not found, skipping."
          fi

      - name: Fix VDSO dependency order in Makefile
        working-directory: kernel
        run: |
          python3 - <<'EOF'
          import re
          path = 'arch/arm64/Makefile'
          with open(path, 'r') as f:
              content = f.read()
          pattern = r'(prepare: vdso_prepare\nvdso_prepare: prepare0\n\t\$\(Q\)\$\(MAKE\) \$\(build\)=arch/arm64/kernel/vdso include/generated/vdso-offsets\.h\n)'
          match = re.search(pattern, content)
          if match:
              block = match.group(1)
              content = content.replace(block, '')
              content = content.replace('PHONY += vdso_install', block + 'PHONY += vdso_install')
              with open(path, 'w') as f:
                  f.write(content)
              print("VDSO dependency order fixed.")
          else:
              print("Pattern not found, maybe already fixed?")
          EOF

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/gcc/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/gcc32/bin/arm-linux-androideabi-"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          DEFCONFIG="${CONFIG_NAME}"
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "Defconfig $DEFCONFIG not found, falling back to sdm845_defconfig"
            DEFCONFIG="sdm845_defconfig"
          fi

          echo "Using defconfig: $DEFCONFIG"
          make O=out ARCH=arm64 $DEFCONFIG
          # 合并 Droidspaces 配置
          if [ -f droidspaces.cfg ]; then
            scripts/kconfig/merge_config.sh -O out out/.config droidspaces.cfg
          else
            echo "droidspaces.cfg not found, skipping merge"
          fi
          make O=out ARCH=arm64 olddefconfig

          # 编译内核
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz

      - name: Prepare artifacts
        working-directory: kernel
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp out/.config artifacts/config 2>/dev/null || true
          echo "✅ Artifacts prepared in kernel/artifacts/"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-judyln-droidspaces
          path: kernel/artifacts/
          retention-days: 7

      - name: Create release package
        if: github.event_name == 'push' || github.ref_type == 'tag'
        working-directory: kernel/artifacts
        run: |
          zip -r ../kernel-judyln-droidspaces.zip .
          echo "✅ Release package created"

      - name: Upload to Release
        if: github.event_name == 'push' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: kernel/kernel-judyln-droidspaces.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
