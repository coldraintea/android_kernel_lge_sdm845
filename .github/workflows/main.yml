name: Build Kernel for judyln with Droidspaces

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: "Kernel defconfig"
        required: true
        default: "lineageos_judyln_defconfig"

      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "lineage-22.2"

env:
  KERNEL_REPO: coldraintea/android_kernel_lge_sdm845
  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
  CONFIG_NAME: ${{ inputs.config_name }}

  ARCH: arm64
  SUBARCH: arm64

  KERNEL_NAME: lineage-kernel-judyln

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. Maximize build space
      # ============================================================
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /share

          df -h

      # ============================================================
      # 2. Checkout kernel
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            rsync \
            python3-distutils \
            python3 \
            git \
            make \
            gcc \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            lz4 \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            curl \
            wget \
            unzip \
            zip \
            file

      # ============================================================
      # 4. Setup original working Clang 11
      # ============================================================
      - name: Setup Clang 11
        working-directory: kernel
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch 11 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            toolchain/clang

          chmod -R +x toolchain/clang/bin

          echo "===== CLANG ====="
          toolchain/clang/bin/clang --version

      # ============================================================
      # 5. Setup original working GCC 4.9
      # ============================================================
      - name: Setup GCC 4.9
        working-directory: kernel
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            toolchain/gcc

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            toolchain/gcc32

          chmod -R +x toolchain/gcc/bin
          chmod -R +x toolchain/gcc32/bin

          echo "===== GCC64 ====="
          toolchain/gcc/bin/aarch64-linux-android-gcc --version

          echo "===== GCC32 ====="
          toolchain/gcc32/bin/arm-linux-androideabi-gcc --version

      # ============================================================
      # 6. Download latest official LineageOS boot.img
      #
      # IMPORTANT:
      # We do this BEFORE kernel compilation.
      #
      # The LineageOS API returns:
      #
      # builds[]
      #   └── files[]
      #         ├── filename
      #         ├── url
      #         ├── sha256
      #         └── size
      #
      # We use the real URL returned by the API.
      # No URL is constructed manually.
      # ============================================================
      - name: Download latest official LineageOS boot.img
        shell: bash
        run: |
          set -euo pipefail

          DEVICE="g710ulm"
          API="https://download.lineageos.org/api/v2/devices/${DEVICE}/builds"

          mkdir -p official

          echo "=========================================="
          echo " LineageOS official boot.img"
          echo "=========================================="
          echo

          echo "[1/4] Fetch build list..."

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 180 \
            -A "GitHubActions-LineageOS-Kernel" \
            "$API" \
            -o official/lineage-builds.json

          test -s official/lineage-builds.json

          echo
          echo "[2/4] Find newest build..."

          python3 <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("official/lineage-builds.json")

          with path.open("r", encoding="utf-8") as f:
              builds = json.load(f)

          if not builds:
              print("ERROR: LineageOS API returned no builds.")
              sys.exit(1)

          # datetime is a Unix timestamp in the current API.
          builds.sort(
              key=lambda x: int(x.get("datetime", 0)),
              reverse=True
          )

          latest = builds[0]

          latest_date = latest.get("date", "")
          latest_datetime = latest.get("datetime", 0)
          latest_version = latest.get("version", "")
          latest_type = latest.get("type", "")

          print("Latest build:")
          print("  date     :", latest_date)
          print("  datetime :", latest_datetime)
          print("  version  :", latest_version)
          print("  type     :", latest_type)

          boot = None

          for item in latest.get("files", []):
              if item.get("filename") == "boot.img":
                  boot = item
                  break

          if boot is None:
              print("ERROR: boot.img was not found in latest build.")
              sys.exit(1)

          filename = boot.get("filename", "")
          url = boot.get("url", "")
          sha256 = boot.get("sha256", "")
          size = int(boot.get("size", 0))

          if filename != "boot.img":
              print("ERROR: unexpected boot filename:", filename)
              sys.exit(1)

          if not url:
              print("ERROR: boot.img URL is empty.")
              sys.exit(1)

          if len(sha256) != 64:
              print("ERROR: invalid SHA256 returned by API.")
              sys.exit(1)

          if size <= 0:
              print("ERROR: invalid boot.img size.")
              sys.exit(1)

          print()
          print("Official boot.img:")
          print("  filename :", filename)
          print("  url      :", url)
          print("  sha256   :", sha256)
          print("  size     :", size)

          with open("official/boot.env", "w", encoding="utf-8") as f:
              f.write(f"LINEAGE_DATE={latest_date}\n")
              f.write(f"LINEAGE_DATETIME={latest_datetime}\n")
              f.write(f"LINEAGE_VERSION={latest_version}\n")
              f.write(f"LINEAGE_TYPE={latest_type}\n")
              f.write(f"BOOT_URL={url}\n")
              f.write(f"BOOT_SHA256={sha256}\n")
              f.write(f"BOOT_SIZE={size}\n")
              f.write(f"BOOT_FILENAME={filename}\n")
          PY

          cat official/boot.env >> "$GITHUB_ENV"

          echo
          echo "[3/4] Download boot.img..."

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "GitHubActions-LineageOS-Kernel" \
            "$BOOT_URL" \
            -o official/boot.img

          test -s official/boot.img

          echo
          echo "[4/4] Verify boot.img..."

          ACTUAL_SIZE=$(stat -c%s official/boot.img)

          echo "Expected size: $BOOT_SIZE"
          echo "Actual size  : $ACTUAL_SIZE"

          if [ "$ACTUAL_SIZE" -ne "$BOOT_SIZE" ]; then
            echo "ERROR: boot.img size mismatch."
            exit 1
          fi

          ACTUAL_SHA256=$(sha256sum official/boot.img | awk '{print $1}')

          echo
          echo "Expected SHA256:"
          echo "$BOOT_SHA256"

          echo
          echo "Actual SHA256:"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$BOOT_SHA256" ]; then
            echo
            echo "ERROR: boot.img SHA256 mismatch."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Official boot.img verified successfully"
          echo "=========================================="

          ls -lh official/boot.img
          file official/boot.img

      # ============================================================
      # 7. Apply cgroup patch
      # ============================================================
      - name: Apply cgroup patch
        working-directory: kernel
        run: |
          if [ -f "02.fix_restore_cgroup_file_prefix_handling.patch" ]; then
            git apply --check \
              02.fix_restore_cgroup_file_prefix_handling.patch

            git apply \
              02.fix_restore_cgroup_file_prefix_handling.patch
          fi

      # ============================================================
      # 8. VDSO32 dependency fix
      # ============================================================
      - name: Fix VDSO32 build dependency
        working-directory: kernel
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/Makefile")
          text = path.read_text()

          original = text

          # ----------------------------------------------------------
          # Add CROSS_COMPILE_COMPAT fallback
          # ----------------------------------------------------------
          if "CROSS_COMPILE_COMPAT" not in text:
              marker = "ifeq ($(KBUILD_EXTMOD),)"

              if marker in text:
                  text = text.replace(
                      marker,
                      "export CROSS_COMPILE_COMPAT ?= $(CROSS_COMPILE_ARM32)\n\n"
                      + marker,
                      1
                  )

          # ----------------------------------------------------------
          # Make vdso_prepare generate vdso32-offsets.h
          # ----------------------------------------------------------
          target = "include/generated/vdso32-offsets.h"

          if target not in text:
              lines = text.splitlines()

              insert_at = None

              for i, line in enumerate(lines):
                  if "include/generated/vdso-offsets.h" in line:
                      insert_at = i + 1
                      break

              if insert_at is not None:
                  block = [
                      "",
                      "ifdef CONFIG_COMPAT_VDSO",
                      "\t$(Q)$(MAKE) $(build)=arch/arm64/kernel/vdso32 include/generated/vdso32-offsets.h",
                      "endif",
                  ]

                  lines[insert_at:insert_at] = block
                  text = "\n".join(lines) + "\n"

          if text == original:
              print("VDSO32 patch already present or no modification required.")
          else:
              path.write_text(text)
              print("VDSO32 dependency fix applied.")

          print("===== VDSO32 relevant lines =====")

          for i, line in enumerate(text.splitlines(), 1):
              if (
                  "CROSS_COMPILE_COMPAT" in line
                  or "vdso_prepare" in line
                  or "vdso-offsets" in line
                  or "vdso32-offsets" in line
              ):
                  print(f"{i}: {line}")
          PY

      # ============================================================
      # 9. Build kernel
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$PWD/toolchain/clang/bin:$PWD/toolchain/gcc/bin:$PWD/toolchain/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$PWD/toolchain/gcc/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$PWD/toolchain/gcc32/bin/arm-linux-androideabi-"
          export CROSS_COMPILE_COMPAT="$CROSS_COMPILE_ARM32"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1

          echo "===== TOOLCHAIN ====="

          which clang
          clang --version

          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"

          # ========================================================
          # DEFCONFIG
          # ========================================================

          echo
          echo "===== DEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            "$CONFIG_NAME"

          # ========================================================
          # Droidspaces config
          # ========================================================

          echo
          echo "===== MERGE DROIDSPACES CONFIG ====="

          if [ -f droidspaces.cfg ]; then
            ./scripts/kconfig/merge_config.sh \
              -m \
              out/.config \
              droidspaces.cfg
          fi

          # ========================================================
          # olddefconfig
          # ========================================================

          echo
          echo "===== OLDDEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          # ========================================================
          # prepare
          # ========================================================

          echo
          echo "===== PREPARE ====="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            prepare

          # ========================================================
          # Verify VDSO
          # ========================================================

          echo
          echo "===== VERIFY VDSO ====="

          test -f out/include/generated/vdso-offsets.h

          if grep -q '^CONFIG_COMPAT_VDSO=y' out/.config; then
            echo "CONFIG_COMPAT_VDSO=y"

            test -f \
              out/include/generated/vdso32-offsets.h

            echo "vdso32-offsets.h exists."
          else
            echo "CONFIG_COMPAT_VDSO is not enabled."
          fi

          # ========================================================
          # Build
          # ========================================================

          echo
          echo "===== BUILD IMAGE.GZ ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            Image.gz

          echo
          echo "===== KERNEL BUILD RESULT ====="

          test -s out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz
          file out/arch/arm64/boot/Image.gz

      # ============================================================
      # 10. Download magiskboot
      # ============================================================
      - name: Prepare magiskboot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p boot-tools

          echo "Downloading latest Magisk package..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk \
            -o boot-tools/Magisk.apk

          echo "Extracting magiskboot..."

          unzip -j \
            boot-tools/Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d boot-tools

          mv \
            boot-tools/libmagiskboot.so \
            boot-tools/magiskboot

          chmod +x boot-tools/magiskboot

          echo
          echo "===== MAGISKBOOT ====="

          ls -lh boot-tools/magiskboot

      # ============================================================
      # 11. Unpack official boot.img
      # ============================================================
      - name: Unpack official boot.img
        shell: bash
        run: |
          set -euo pipefail

          rm -rf boot-extracted
          mkdir -p boot-extracted

          cp \
            official/boot.img \
            boot-extracted/official-boot.img

          cd boot-extracted

          echo "===== UNPACK BOOT ====="

          ../boot-tools/magiskboot \
            unpack \
            official-boot.img

          echo
          echo "===== EXTRACTED FILES ====="

          find . \
            -maxdepth 2 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          if [ ! -f kernel ]; then
            echo
            echo "ERROR: magiskboot did not extract a kernel file."
            exit 1
          fi

          echo
          echo "Original kernel:"
          ls -lh kernel
          file kernel

      # ============================================================
      # 12. Replace kernel with newly compiled Image.gz
      # ============================================================
      - name: Replace boot kernel with Image.gz
        shell: bash
        run: |
          set -euo pipefail

          echo "===== NEW KERNEL ====="

          test -s kernel/out/arch/arm64/boot/Image.gz

          ls -lh kernel/out/arch/arm64/boot/Image.gz
          file kernel/out/arch/arm64/boot/Image.gz

          echo
          echo "===== REPLACE ====="

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            boot-extracted/kernel

          echo
          echo "New boot kernel:"
          ls -lh boot-extracted/kernel
          file boot-extracted/kernel

      # ============================================================
      # 13. Repack boot.img
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -euo pipefail

          cd boot-extracted

          echo "===== REPACK ====="

          ../boot-tools/magiskboot \
            repack \
            official-boot.img

          if [ ! -f new-boot.img ]; then
            echo "ERROR: new-boot.img was not created."
            exit 1
          fi

          test -s new-boot.img

          mv \
            new-boot.img \
            ../${KERNEL_NAME}.img

          cd ..

          echo
          echo "===== FINAL BOOT IMAGE ====="

          ls -lh "${KERNEL_NAME}.img"
          file "${KERNEL_NAME}.img"

      # ============================================================
      # 14. Validate final boot.img
      # ============================================================
      - name: Validate final boot.img
        shell: bash
        run: |
          set -euo pipefail

          test -s "${KERNEL_NAME}.img"

          SIZE=$(stat -c%s "${KERNEL_NAME}.img")

          echo "Final boot.img:"
          ls -lh "${KERNEL_NAME}.img"

          echo
          echo "Size:"
          echo "$SIZE bytes"

          echo
          echo "SHA256:"
          sha256sum "${KERNEL_NAME}.img"

          echo
          echo "===== OFFICIAL BASE ====="

          echo "LineageOS version : $LINEAGE_VERSION"
          echo "LineageOS date    : $LINEAGE_DATE"
          echo "LineageOS build   : $LINEAGE_TYPE"
          echo "Official boot URL : $BOOT_URL"
          echo "Official boot SHA : $BOOT_SHA256"
          echo "Official boot size: $BOOT_SIZE"

      # ============================================================
      # 15. Create release package
      # ============================================================
      - name: Create release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          # Final modified boot image
          cp \
            "${KERNEL_NAME}.img" \
            release/boot.img

          # Newly compiled kernel
          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            release/Image.gz

          # Original official boot image
          cp \
            official/boot.img \
            release/official-boot.img

          # Build API response
          cp \
            official/lineage-builds.json \
            release/lineage-builds.json

          cat > release/README.txt <<EOF
Kernel build for LG G7 ThinQ G710ULM / judyln

Kernel repository:
https://github.com/coldraintea/android_kernel_lge_sdm845

Kernel branch:
${KERNEL_BRANCH}

Defconfig:
${CONFIG_NAME}

LineageOS version:
${LINEAGE_VERSION}

LineageOS build date:
${LINEAGE_DATE}

Official LineageOS boot.img:
${BOOT_URL}

Official boot.img SHA256:
${BOOT_SHA256}

Official boot.img size:
${BOOT_SIZE}

Files:

boot.img
  Repacked official LineageOS boot.img
  with the newly compiled Image.gz.

Image.gz
  Newly compiled kernel.

official-boot.img
  Original official LineageOS boot.img.

lineage-builds.json
  Official LineageOS build API response.

WARNING:
This kernel is for testing.
Flash at your own risk.
EOF

          echo "===== RELEASE FILES ====="

          ls -lah release

          cd release

          zip -9 \
            "../${KERNEL_NAME}.zip" \
            boot.img \
            Image.gz \
            official-boot.img \
            lineage-builds.json \
            README.txt

          cd ..

          echo
          echo "===== PACKAGE ====="

          ls -lh "${KERNEL_NAME}.zip"

          echo
          echo "SHA256:"
          sha256sum \
            "${KERNEL_NAME}.zip" \
            "${KERNEL_NAME}.img"

      # ============================================================
      # 16. Upload artifacts
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}
          path: |
            ${{ env.KERNEL_NAME }}.zip
            ${{ env.KERNEL_NAME }}.img
            kernel/out/arch/arm64/boot/Image.gz
            official/boot.img
            release/README.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 17. GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KERNEL_NAME }}-${{ github.run_number }}
          name: "${{ env.KERNEL_NAME }} build #${{ github.run_number }}"
          body: |
            ## LG G7 ThinQ G710ULM / judyln Kernel

            ### Kernel

            Repository:
            `coldraintea/android_kernel_lge_sdm845`

            Branch:
            `${{ env.KERNEL_BRANCH }}`

            Defconfig:
            `${{ env.CONFIG_NAME }}`

            ### Official LineageOS base

            Version:
            `${{ env.LINEAGE_VERSION }}`

            Build date:
            `${{ env.LINEAGE_DATE }}`

            Official boot.img:
            `${{ env.BOOT_URL }}`

            Official boot.img SHA256:
            `${{ env.BOOT_SHA256 }}`

            Official boot.img size:
            `${{ env.BOOT_SIZE }}` bytes

            ### Packaging

            The official LineageOS boot.img was downloaded and
            SHA256-verified BEFORE kernel compilation.

            The newly compiled `Image.gz` was then inserted into
            the verified official boot.img and repacked.

            ### Release files

            - `${{ env.KERNEL_NAME }}.img`
            - `${{ env.KERNEL_NAME }}.zip`

            The ZIP also contains:

            - `boot.img`
            - `Image.gz`
            - `official-boot.img`
            - `lineage-builds.json`
            - `README.txt`

            ### Warning

            Experimental/test kernel.
            Flash at your own risk.
          files: |
            ${{ env.KERNEL_NAME }}.zip
            ${{ env.KERNEL_NAME }}.img
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
