name: Build Kernel for judyln with Droidspaces

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Defconfig name'
        required: false
        default: 'lineageos_judyln_defconfig'

      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'lineage-22.2'

jobs:

  build-kernel:

    name: Build Kernel

    runs-on: ubuntu-22.04

    timeout-minutes: 120

    env:
      CONFIG_NAME: ${{ github.event.inputs.config_name || 'lineageos_judyln_defconfig' }}
      KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}

    steps:

      # =========================================================
      # Maximize build space
      # =========================================================

      - name: Maximize build space
        run: |
          set -eux

          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /share || true

          df -h


      # =========================================================
      # Checkout kernel source
      # =========================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4

        with:
          repository: coldraintea/android_kernel_lge_sdm845
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive


      # =========================================================
      # Install build dependencies
      # =========================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            rsync \
            python3-distutils \
            python3 \
            git \
            make \
            gcc \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler \
            cpio \
            lz4 \
            clang \
            llvm


      # =========================================================
      # Setup Clang 11.0.1
      #
      # KEEP ORIGINAL WORKING TOOLCHAIN
      # =========================================================

      - name: Setup toolchain (Clang 11.0.1)
        run: |
          set -eux

          mkdir -p toolchain

          rm -rf toolchain/clang

          echo "========================================"
          echo "Downloading Clang 11"
          echo "========================================"

          git clone \
            --depth=1 \
            -b 11 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            toolchain/clang

          test -d toolchain/clang/bin

          chmod -R +x toolchain/clang/bin

          echo "=== Clang bin contents ==="

          ls -lah toolchain/clang/bin | head -50

          echo
          echo "=== Clang version ==="

          toolchain/clang/bin/clang --version


      # =========================================================
      # Setup GCC 4.9 from LineageOS
      #
      # KEEP ORIGINAL WORKING TOOLCHAIN
      # =========================================================

      - name: Setup toolchain (GCC 4.9 from LineageOS)
        run: |
          set -eux

          rm -rf \
            toolchain/gcc \
            toolchain/gcc32

          echo "========================================"
          echo "Downloading AArch64 GCC 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            toolchain/gcc

          echo "========================================"
          echo "Downloading ARM32 GCC 4.9"
          echo "========================================"

          git clone \
            --depth=1 \
            -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            toolchain/gcc32

          echo
          echo "=== Contents of toolchain/gcc ==="

          ls -lah toolchain/gcc

          echo
          echo "=== Contents of toolchain/gcc32 ==="

          ls -lah toolchain/gcc32

          echo
          echo "=== Checking GCC binaries ==="

          test -d toolchain/gcc/bin
          test -d toolchain/gcc32/bin

          test -x \
            toolchain/gcc/bin/aarch64-linux-android-gcc

          test -x \
            toolchain/gcc32/bin/arm-linux-androideabi-gcc

          chmod -R +x toolchain/gcc/bin
          chmod -R +x toolchain/gcc32/bin

          echo
          echo "=== AArch64 GCC ==="

          toolchain/gcc/bin/aarch64-linux-android-gcc --version

          echo
          echo "=== ARM32 GCC ==="

          toolchain/gcc32/bin/arm-linux-androideabi-gcc --version


      # =========================================================
      # Verify complete toolchain
      # =========================================================

      - name: Verify complete toolchain
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          command -v clang
          clang --version

          echo
          echo "========================================"
          echo "AARCH64 GCC"
          echo "========================================"

          command -v aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

          echo
          echo "========================================"
          echo "ARM32 GCC"
          echo "========================================"

          command -v arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          command -v ld.lld || true
          ld.lld --version || true


      # =========================================================
      # Apply existing cgroup patch
      # =========================================================

      - name: Apply cgroup prefix handling patch
        working-directory: kernel
        run: |
          set -eux

          if [ -f 02.fix_restore_cgroup_file_prefix_handling.patch ]; then

            echo "Applying cgroup patch..."

            patch -p1 \
              < 02.fix_restore_cgroup_file_prefix_handling.patch

          else

            echo "Patch not found, skipping."

          fi


      # =========================================================
      # Fix ARM64 VDSO32 dependency
      #
      # IMPORTANT:
      #
      # The original build generated:
      #
      #   include/generated/vdso-offsets.h
      #
      # but did not generate:
      #
      #   include/generated/vdso32-offsets.h
      #
      # before signal.o was compiled.
      #
      # This patch adds the missing dependency to vdso_prepare.
      # =========================================================

      - name: Apply ARM64 VDSO32 build-order patch
        working-directory: kernel
        run: |
          set -eux

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("arch/arm64/Makefile")

          text = path.read_text()

          print("=== Checking arch/arm64/Makefile ===")

          # -----------------------------------------------------
          # 1. Make sure CROSS_COMPILE_COMPAT is available
          # -----------------------------------------------------

          compat_line = \
              "export CROSS_COMPILE_COMPAT ?= $(CROSS_COMPILE_ARM32)"

          if "CROSS_COMPILE_COMPAT ?= $(CROSS_COMPILE_ARM32)" not in text:

              # Insert before the VDSO preparation block.
              marker = "ifeq ($(KBUILD_EXTMOD),)"

              if marker in text:

                  text = text.replace(
                      marker,
                      "ifeq ($(CONFIG_COMPAT_VDSO),y)\n"
                      f"{compat_line}\n"
                      "endif\n\n"
                      + marker,
                      1
                  )

                  print(
                      "Added CROSS_COMPILE_COMPAT "
                      "fallback."
                  )

              else:
                  raise SystemExit(
                      "Could not find KBUILD_EXTMOD marker."
                  )

          else:
              print(
                  "CROSS_COMPILE_COMPAT already defined."
              )


          # -----------------------------------------------------
          # 2. Find vdso_prepare block
          # -----------------------------------------------------

          if "vdso_prepare:" not in text:
              raise SystemExit(
                  "vdso_prepare block not found."
              )


          # -----------------------------------------------------
          # 3. Check whether vdso32 header dependency already
          #    exists.
          # -----------------------------------------------------

          if "include/generated/vdso32-offsets.h" in text:

              print(
                  "vdso32-offsets.h dependency already exists."
              )

          else:

              # Match the normal arm64 VDSO generation command.
              pattern = (
                  r"(\$\(Q\)\$\(MAKE\)\s+"
                  r"\$\(build\)=arch/arm64/kernel/vdso"
                  r"[^\n]*"
                  r"include/generated/vdso-offsets\.h[^\n]*\n)"
              )

              match = re.search(pattern, text)

              if not match:
                  raise SystemExit(
                      "Could not find arm64 vdso "
                      "generation command."
                  )

              original = match.group(1)

              replacement = (
                  original
                  + "ifdef CONFIG_COMPAT_VDSO\n"
                  + "\t$(Q)$(MAKE) $(build)="
                    "arch/arm64/kernel/vdso32 "
                    "include/generated/vdso32-offsets.h\n"
                  + "endif\n"
              )

              text = text.replace(
                  original,
                  replacement,
                  1
              )

              print(
                  "Added vdso32-offsets.h generation "
                  "to vdso_prepare."
              )


          path.write_text(text)

          print()
          print("=== Patched arch/arm64/Makefile ===")
          print()

          for i, line in enumerate(
              text.splitlines(),
              start=1
          ):
              if (
                  "vdso_prepare" in line
                  or "vdso32-offsets" in line
                  or "CROSS_COMPILE_COMPAT" in line
              ):
                  start = max(1, i - 2)
                  end = min(
                      len(text.splitlines()),
                      i + 3
                  )

                  lines = text.splitlines()

                  for n in range(start, end + 1):
                      print(
                          f"{n:5}: {lines[n - 1]}"
                      )

          PY


      # =========================================================
      # Build kernel
      # =========================================================

      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          export ARCH=arm64

          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/gcc/bin/aarch64-linux-android-"

          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/toolchain/gcc32/bin/arm-linux-androideabi-"

          export CROSS_COMPILE_COMPAT="$CROSS_COMPILE_ARM32"

          export CC=clang

          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CONFIG_NAME="${CONFIG_NAME}"

          echo
          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          echo "clang:"
          clang --version | head -1

          echo
          echo "aarch64 gcc:"
          aarch64-linux-android-gcc --version | head -1

          echo
          echo "arm32 gcc:"
          arm-linux-androideabi-gcc --version | head -1


          # =====================================================
          # Defconfig
          # =====================================================

          DEFCONFIG="${CONFIG_NAME}"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then

            echo "Defconfig $DEFCONFIG not found."

            echo "Falling back to sdm845_defconfig."

            DEFCONFIG="sdm845_defconfig"

          fi

          echo
          echo "========================================"
          echo "DEFCONFIG"
          echo "========================================"

          echo "Using defconfig: $DEFCONFIG"


          rm -rf out

          mkdir -p out


          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"


          test -f out/.config


          # =====================================================
          # Merge Droidspaces configuration
          # =====================================================

          echo
          echo "========================================"
          echo "DROIDSPACES CONFIG"
          echo "========================================"

          if [ -f droidspaces.cfg ]; then

            scripts/kconfig/merge_config.sh \
              -O out \
              out/.config \
              droidspaces.cfg

          else

            echo "droidspaces.cfg not found."

          fi


          # =====================================================
          # Normalize config
          # =====================================================

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig


          echo
          echo "========================================"
          echo "VDSO CONFIG"
          echo "========================================"

          grep -E \
            'CONFIG_(COMPAT|GENERIC_COMPAT_VDSO|COMPAT_VDSO)' \
            out/.config || true


          # =====================================================
          # Verify CROSS_COMPILE_COMPAT
          # =====================================================

          echo
          echo "========================================"
          echo "COMPAT TOOLCHAIN"
          echo "========================================"

          echo "CROSS_COMPILE:"
          echo "$CROSS_COMPILE"

          echo "CROSS_COMPILE_ARM32:"
          echo "$CROSS_COMPILE_ARM32"

          echo "CROSS_COMPILE_COMPAT:"
          echo "$CROSS_COMPILE_COMPAT"

          test -x \
            "${CROSS_COMPILE_ARM32}gcc"

          test -x \
            "${CROSS_COMPILE_ARM32}ld"


          # =====================================================
          # Generate all preparation files
          #
          # This is the critical part.
          #
          # The patched arm64 Makefile now makes prepare generate:
          #
          #   include/generated/vdso-offsets.h
          #   include/generated/vdso32-offsets.h
          #
          # before signal.o is compiled.
          # =====================================================

          echo
          echo "========================================"
          echo "KERNEL PREPARE"
          echo "========================================"

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            prepare


          # =====================================================
          # Verify VDSO headers
          # =====================================================

          echo
          echo "========================================"
          echo "CHECK VDSO HEADERS"
          echo "========================================"

          echo "Searching for vdso headers..."

          find out/include/generated \
            -maxdepth 1 \
            -type f \
            -name 'vdso*-offsets.h' \
            -print


          echo
          echo "Checking 64-bit VDSO header..."

          test -f \
            out/include/generated/vdso-offsets.h


          if grep -q '^CONFIG_COMPAT_VDSO=y' out/.config; then

            echo
            echo "CONFIG_COMPAT_VDSO=y"
            echo "Checking 32-bit VDSO header..."

            test -f \
              out/include/generated/vdso32-offsets.h

            echo
            echo "vdso32-offsets.h exists."

          else

            echo
            echo "CONFIG_COMPAT_VDSO is not enabled."

          fi


          # =====================================================
          # Build Image.gz
          # =====================================================

          echo
          echo "========================================"
          echo "BUILDING IMAGE.GZ"
          echo "========================================"

          make \
            -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz


          # =====================================================
          # Verify kernel
          # =====================================================

          echo
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          test -f \
            out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz

          echo
          echo "========================================"
          echo "KERNEL BUILD SUCCESS"
          echo "========================================"


      # =========================================================
      # Prepare artifacts
      # =========================================================

      - name: Prepare artifacts
        if: success()
        working-directory: kernel
        run: |
          set -eux

          mkdir -p artifacts

          cp \
            out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp \
            out/.config \
            artifacts/config

          if [ -f out/arch/arm64/boot/Image ]; then

            cp \
              out/arch/arm64/boot/Image \
              artifacts/Image

          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then

            cp \
              out/arch/arm64/boot/dtbo.img \
              artifacts/dtbo.img

          fi

          echo
          echo "========================================"
          echo "ARTIFACTS"
          echo "========================================"

          find artifacts \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "Artifacts prepared.
