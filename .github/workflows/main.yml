name: Build Kernel for judyln with Droidspaces

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: "Kernel defconfig"
        required: true
        default: "lineageos_judyln_defconfig"

      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "lineage-22.2"

env:
  KERNEL_REPO: coldraintea/android_kernel_lge_sdm845
  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
  CONFIG_NAME: ${{ inputs.config_name }}

  ARCH: arm64
  SUBARCH: arm64

  CROSS_COMPILE: ${{ github.workspace }}/kernel/toolchain/gcc/bin/aarch64-linux-android-
  CROSS_COMPILE_ARM32: ${{ github.workspace }}/kernel/toolchain/gcc32/bin/arm-linux-androideabi-
  CROSS_COMPILE_COMPAT: ${{ github.workspace }}/kernel/toolchain/gcc32/bin/arm-linux-androideabi-

  CLANG_PATH: ${{ github.workspace }}/kernel/toolchain/clang/bin

  KERNEL_NAME: lineage-kernel-judyln

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. Maximize build space
      # ============================================================
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /share

          df -h

      # ============================================================
      # 2. Checkout kernel
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            rsync \
            python3-distutils \
            python3 \
            git \
            make \
            gcc \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            lz4 \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            curl \
            wget \
            unzip \
            zip \
            jq \
            file

      # ============================================================
      # 4. Setup original working Clang
      # ============================================================
      - name: Setup Clang 11
        working-directory: kernel
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch 11 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            toolchain/clang

          chmod -R +x toolchain/clang/bin

          echo "===== CLANG ====="
          toolchain/clang/bin/clang --version
          ls -la toolchain/clang/bin | head -30

      # ============================================================
      # 5. Setup original working GCC 4.9
      # ============================================================
      - name: Setup GCC 4.9
        working-directory: kernel
        run: |
          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            toolchain/gcc

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            toolchain/gcc32

          chmod -R +x toolchain/gcc/bin
          chmod -R +x toolchain/gcc32/bin

          echo "===== GCC64 ====="
          toolchain/gcc/bin/aarch64-linux-android-gcc --version

          echo "===== GCC32 ====="
          toolchain/gcc32/bin/arm-linux-androideabi-gcc --version

      # ============================================================
      # 6. Apply cgroup patch
      # ============================================================
      - name: Apply cgroup patch
        working-directory: kernel
        run: |
          if [ -f "02.fix_restore_cgroup_file_prefix_handling.patch" ]; then
            git apply --check \
              02.fix_restore_cgroup_file_prefix_handling.patch

            git apply \
              02.fix_restore_cgroup_file_prefix_handling.patch
          fi

      # ============================================================
      # 7. VDSO32 dependency fix
      # ============================================================
      - name: Fix VDSO32 build dependency
        working-directory: kernel
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/Makefile")
          text = path.read_text()

          original = text

          # ----------------------------------------------------------
          # Make CROSS_COMPILE_COMPAT available to old arm64 Makefiles
          # ----------------------------------------------------------
          if "CROSS_COMPILE_COMPAT" not in text:
              marker = "ifeq ($(KBUILD_EXTMOD),)"
              if marker in text:
                  text = text.replace(
                      marker,
                      "export CROSS_COMPILE_COMPAT ?= $(CROSS_COMPILE_ARM32)\n\n"
                      + marker,
                      1
                  )

          # ----------------------------------------------------------
          # Make vdso_prepare explicitly generate vdso32-offsets.h
          # ----------------------------------------------------------
          target = "include/generated/vdso32-offsets.h"

          if target not in text:
              lines = text.splitlines()

              insert_at = None

              for i, line in enumerate(lines):
                  if "include/generated/vdso-offsets.h" in line:
                      insert_at = i + 1
                      break

              if insert_at is not None:
                  block = [
                      "",
                      "ifdef CONFIG_COMPAT_VDSO",
                      "\t$(Q)$(MAKE) $(build)=arch/arm64/kernel/vdso32 include/generated/vdso32-offsets.h",
                      "endif",
                  ]

                  lines[insert_at:insert_at] = block
                  text = "\n".join(lines) + "\n"

          if text == original:
              print("VDSO32 patch already present or no modification required.")
          else:
              path.write_text(text)
              print("VDSO32 dependency fix applied.")

          print("===== arch/arm64/Makefile relevant lines =====")

          for i, line in enumerate(text.splitlines(), 1):
              if (
                  "CROSS_COMPILE_COMPAT" in line
                  or "vdso_prepare" in line
                  or "vdso-offsets" in line
                  or "vdso32-offsets" in line
              ):
                  print(f"{i}: {line}")
          PY

      # ============================================================
      # 8. Build kernel
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          export PATH="$PWD/toolchain/clang/bin:$PWD/toolchain/gcc/bin:$PWD/toolchain/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$PWD/toolchain/gcc/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$PWD/toolchain/gcc32/bin/arm-linux-androideabi-"
          export CROSS_COMPILE_COMPAT="$CROSS_COMPILE_ARM32"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export LLVM=1

          echo "===== TOOLCHAIN ====="
          which clang
          clang --version

          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"

          echo "===== DEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            "$CONFIG_NAME"

          echo "===== MERGE DROIDSPACES CONFIG ====="

          if [ -f droidspaces.cfg ]; then
            ./scripts/kconfig/merge_config.sh \
              -m \
              out/.config \
              droidspaces.cfg
          fi

          echo "===== OLDDEFCONFIG ====="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          echo "===== PREPARE ====="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            prepare

          echo "===== VERIFY VDSO ====="

          test -f out/include/generated/vdso-offsets.h

          if grep -q '^CONFIG_COMPAT_VDSO=y' out/.config; then
            echo "CONFIG_COMPAT_VDSO=y"

            test -f \
              out/include/generated/vdso32-offsets.h

            echo "vdso32-offsets.h exists."
          else
            echo "CONFIG_COMPAT_VDSO is not enabled."
          fi

          echo "===== BUILD IMAGE.GZ ====="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            Image.gz

          echo "===== KERNEL BUILD RESULT ====="

          ls -lh out/arch/arm64/boot/Image.gz

          file out/arch/arm64/boot/Image.gz

      # ============================================================
      # 9. Get latest official LineageOS build information
      # ============================================================
      - name: Get latest official LineageOS build
        shell: bash
        run: |
          set -e

          API_URL="https://download.lineageos.org/api/v2/devices/g710ulm/builds"

          echo "Fetching:"
          echo "$API_URL"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            -A "GitHubActions-LineageOS-Kernel" \
            "$API_URL" \
            -o lineage-builds.json

          echo "===== API RESPONSE ====="

          python3 - <<'PY'
          import json

          with open("lineage-builds.json", "r") as f:
              data = json.load(f)

          print("Number of builds:", len(data))

          if not data:
              raise SystemExit("No LineageOS builds returned.")

          print(json.dumps(data[0], indent=2)[:5000])
          PY

          # ----------------------------------------------------------
          # Pick the newest build.
          #
          # The LineageOS API provides builds in chronological order
          # in normal operation, but sort explicitly by datetime.
          # ----------------------------------------------------------
          python3 <<'PY'
          import json
          from datetime import datetime

          with open("lineage-builds.json", "r") as f:
              builds = json.load(f)

          if not builds:
              raise SystemExit("No builds found.")

          def get_date(build):
              value = build.get("datetime", "")

              try:
                  return datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
              except Exception:
                  return datetime.min

          builds.sort(
              key=get_date,
              reverse=True
          )

          latest = builds[0]

          print("===== LATEST BUILD =====")
          print(json.dumps(latest, indent=2))

          filename = latest.get("filename")
          datetime_value = latest.get("datetime")
          version = latest.get("version")
          url = latest.get("url")

          if not filename:
              raise SystemExit("Latest build has no filename.")

          if not datetime_value:
              raise SystemExit("Latest build has no datetime.")

          print("")
          print("LATEST_FILENAME=" + filename)
          print("LATEST_DATETIME=" + datetime_value)
          print("LATEST_VERSION=" + str(version))
          print("LATEST_URL=" + str(url))

          with open("lineage-latest.env", "w") as f:
              f.write("LATEST_FILENAME=" + filename + "\n")
              f.write("LATEST_DATETIME=" + datetime_value + "\n")
              f.write("LATEST_VERSION=" + str(version or "") + "\n")
              f.write("LATEST_URL=" + str(url or "") + "\n")
          PY

          cat lineage-latest.env >> "$GITHUB_ENV"

      # ============================================================
      # 10. Download official boot.img
      # ============================================================
      - name: Download latest official boot.img
        shell: bash
        run: |
          set -e

          echo "Official LineageOS build:"
          echo "$LATEST_FILENAME"

          echo "Build datetime:"
          echo "$LATEST_DATETIME"

          # ----------------------------------------------------------
          # LineageOS mirror layout:
          #
          # mirrorbits.lineageos.org/full/<device>/<date>/
          #
          # Example:
          # /full/g710ulm/20260815/boot.img
          # ----------------------------------------------------------

          BUILD_DATE="${LATEST_DATETIME:0:10}"
          BUILD_DATE="${BUILD_DATE//-/}"

          BOOT_URL="https://mirrorbits.lineageos.org/full/g710ulm/${BUILD_DATE}/boot.img"

          echo "BOOT_URL=$BOOT_URL"

          mkdir -p official

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "GitHubActions-LineageOS-Kernel" \
            "$BOOT_URL" \
            -o official/boot.img

          echo "===== DOWNLOADED BOOT ====="

          ls -lh official/boot.img
          file official/boot.img

          # ----------------------------------------------------------
          # Basic validation
          # ----------------------------------------------------------

          test -s official/boot.img

          SIZE=$(stat -c%s official/boot.img)

          echo "boot.img size: $SIZE bytes"

          # G710ULM LineageOS boot image is expected to be tens of MB.
          # Refuse obviously invalid HTML/error downloads.
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: boot.img is suspiciously small."
            exit 1
          fi

          echo "Official boot.img downloaded successfully."

      # ============================================================
      # 11. Extract official boot.img
      # ============================================================
      - name: Extract official boot.img
        shell: bash
        run: |
          set -e

          mkdir -p boot-extracted

          cd boot-extracted

          echo "===== CHECK FOR MAGISKBOOT ====="

          if command -v magiskboot >/dev/null 2>&1; then
            echo "magiskboot already available."
          else
            echo "Downloading magiskboot..."

            curl -L \
              --fail \
              --retry 5 \
              https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.zip \
              -o Magisk.zip

            unzip -j \
              Magisk.zip \
              "lib/x86_64/libmagiskboot.so" \
              -d .

            mv libmagiskboot.so magiskboot
            chmod +x magiskboot
          fi

          echo "===== UNPACK BOOT IMAGE ====="

          ../boot-extracted/magiskboot unpack ../official/boot.img

          echo "===== EXTRACTED FILES ====="

          find . -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      # ============================================================
      # 12. Replace kernel Image.gz
      # ============================================================
      - name: Replace Image.gz in official boot.img
        shell: bash
        run: |
          set -e

          echo "===== KERNEL ====="

          ls -lh kernel/out/arch/arm64/boot/Image.gz

          test -s kernel/out/arch/arm64/boot/Image.gz

          echo "===== BOOT CONTENTS ====="

          ls -lah boot-extracted

          # ----------------------------------------------------------
          # magiskboot normally extracts the kernel as:
          #
          # kernel
          #
          # For this device the kernel is the compressed Image.gz.
          # We replace it with our freshly compiled kernel.
          # ----------------------------------------------------------

          if [ ! -f boot-extracted/kernel ]; then
            echo "ERROR: unpacked boot.img does not contain 'kernel'."

            echo "===== DIRECTORY ====="
            find boot-extracted -maxdepth 2 -type f -ls

            exit 1
          fi

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            boot-extracted/kernel

          echo "===== NEW KERNEL ====="

          ls -lh boot-extracted/kernel

          file boot-extracted/kernel

      # ============================================================
      # 13. Repack boot.img
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -e

          cd boot-extracted

          echo "===== REPACK ====="

          ./magiskboot repack ../official/boot.img

          echo "===== REPACK RESULT ====="

          ls -lah

          if [ ! -f new-boot.img ]; then
            echo "ERROR: new-boot.img was not created."
            exit 1
          fi

          test -s new-boot.img

          ls -lh new-boot.img

          file new-boot.img

          mv new-boot.img ../${KERNEL_NAME}.img

      # ============================================================
      # 14. Validate final boot.img
      # ============================================================
      - name: Validate final boot.img
        shell: bash
        run: |
          set -e

          echo "===== FINAL BOOT IMAGE ====="

          ls -lh "${KERNEL_NAME}.img"

          file "${KERNEL_NAME}.img"

          SIZE=$(stat -c%s "${KERNEL_NAME}.img")

          echo "Final boot.img size: $SIZE bytes"

          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: final boot.img is suspiciously small."
            exit 1
          fi

          sha256sum "${KERNEL_NAME}.img"

          echo ""
          echo "===== OFFICIAL BUILD ====="
          echo "$LATEST_FILENAME"

          echo ""
          echo "===== BUILD DATE ====="
          echo "$LATEST_DATETIME"

          echo ""
          echo "===== FINAL IMAGE ====="
          echo "${KERNEL_NAME}.img"

      # ============================================================
      # 15. Create release package
      # ============================================================
      - name: Create release package
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp \
            "${KERNEL_NAME}.img" \
            release/boot.img

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            release/Image.gz

          cp \
            official/boot.img \
            release/official-boot.img

          cp \
            lineage-builds.json \
            release/lineage-builds.json

          cat > release/README.txt <<EOF
          Kernel build for LG G7 ThinQ G710ULM/VMX

          Kernel repository:
          https://github.com/coldraintea/android_kernel_lge_sdm845

          Kernel branch:
          ${KERNEL_BRANCH}

          Defconfig:
          ${CONFIG_NAME}

          Official LineageOS base:
          ${LATEST_FILENAME}

          Official LineageOS build date:
          ${LATEST_DATETIME}

          Official LineageOS build:
          ${LATEST_URL}

          Files:

          boot.img
            Repacked official LineageOS boot.img with newly compiled Image.gz.

          Image.gz
            Newly compiled kernel.

          official-boot.img
            Original official LineageOS boot.img used as the packaging base.

          WARNING:
          This image is provided for testing purposes.
          Flash at your own risk.
          EOF

          echo "===== RELEASE CONTENT ====="

          ls -lah release

          cd release

          zip -9 \
            "../${KERNEL_NAME}.zip" \
            boot.img \
            Image.gz \
            official-boot.img \
            README.txt

          cd ..

          echo "===== PACKAGE ====="

          ls -lh "${KERNEL_NAME}.zip"

          sha256sum \
            "${KERNEL_NAME}.zip" \
            "${KERNEL_NAME}.img"

      # ============================================================
      # 16. Upload artifacts
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}
          path: |
            ${{ env.KERNEL_NAME }}.zip
            ${{ env.KERNEL_NAME }}.img
            kernel/out/arch/arm64/boot/Image.gz
            official/boot.img
            release/README.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 17. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KERNEL_NAME }}-${{ github.run_number }}
          name: "${{ env.KERNEL_NAME }} build #${{ github.run_number }}"
          body: |
            ## LG G7 ThinQ G710ULM/VMX Kernel

            Kernel branch:
            `${{ env.KERNEL_BRANCH }}`

            Defconfig:
            `${{ env.CONFIG_NAME }}`

            ### Official LineageOS base

            `${{ env.LATEST_FILENAME }}`

            Build date:

            `${{ env.LATEST_DATETIME }}`

            The official LineageOS boot.img was downloaded automatically
            and used as the packaging base.

            The newly compiled `Image.gz` was inserted into that boot.img.

            ### Files

            - `${{ env.KERNEL_NAME }}.zip`
            - `${{ env.KERNEL_NAME }}.img`

            The `.img` file is the final repacked boot image.

            The ZIP also contains:
            - `boot.img`
            - `Image.gz`
            - `official-boot.img`
            - build information

            ### Warning

            Test/experimental kernel.
            Flash at your own risk.
          files: |
            ${{ env.KERNEL_NAME }}.zip
            ${{ env.KERNEL_NAME }}.img
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
