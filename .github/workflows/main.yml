name: Build Android Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-22.2
  pull_request:
    branches:
      - lineage-22.2

permissions:
  contents: read

env:
  ARCH: arm64

  # Kernel source
  KERNEL_DIR: ${{ github.workspace }}

  # Output directory
  OUT_DIR: ${{ github.workspace }}/out

  # Toolchains
  CLANG_DIR: ${{ github.workspace }}/toolchain/clang
  GCC64_DIR: ${{ github.workspace }}/toolchain/gcc
  GCC32_DIR: ${{ github.workspace }}/toolchain/gcc32

  # Cross compiler
  CROSS_COMPILE: ${{ github.workspace }}/toolchain/gcc/bin/aarch64-linux-android-
  CROSS_COMPILE_ARM32: ${{ github.workspace }}/toolchain/gcc32/bin/arm-linux-androideabi-

  CC: clang
  CLANG_TRIPLE: aarch64-linux-gnu-

  # Kernel config
  DEFCONFIG: lineageos_judyln_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # Checkout kernel
      # ---------------------------------------------------------
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-22.2
          fetch-depth: 1
          submodules: false

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            cpio \
            python3 \
            python3-pip \
            python3-setuptools \
            lz4 \
            dwarves \
            rsync \
            unzip \
            zip \
            wget \
            curl \
            ca-certificates \
            file

      # ---------------------------------------------------------
      # Prepare directories
      # ---------------------------------------------------------
      - name: Prepare build directories
        run: |
          set -eux

          rm -rf "${CLANG_DIR}"
          rm -rf "${GCC64_DIR}"
          rm -rf "${GCC32_DIR}"
          rm -rf "${OUT_DIR}"

          mkdir -p "${CLANG_DIR}"
          mkdir -p "${GCC64_DIR}"
          mkdir -p "${GCC32_DIR}"
          mkdir -p "${OUT_DIR}"

      # ---------------------------------------------------------
      # Download Android Clang r383902
      #
      # Android 11 Clang
      # clang version 11.0.1
      # ---------------------------------------------------------
      - name: Download Android Clang r383902
        run: |
          set -eux

          rm -rf clang-src

          git clone \
            --depth=1 \
            --branch android-11.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-src

          echo "Checking Clang..."

          test -d clang-src/clang-r383902
          test -d clang-src/clang-r383902/bin
          test -x clang-src/clang-r383902/bin/clang

          cp -a clang-src/clang-r383902/. "${CLANG_DIR}/"

          test -x "${CLANG_DIR}/bin/clang"
          test -x "${CLANG_DIR}/bin/clang++"
          test -x "${CLANG_DIR}/bin/ld.lld"

          echo "Clang version:"
          "${CLANG_DIR}/bin/clang" --version

          echo "Clang location:"
          ls -lah "${CLANG_DIR}/bin/clang"

      # ---------------------------------------------------------
      # Download AArch64 GCC 4.9
      #
      # IMPORTANT:
      # Do NOT use the repository default branch.
      # The default branch may no longer contain the old
      # prebuilt GCC directory structure.
      # ---------------------------------------------------------
      - name: Download AArch64 GCC 4.9
        run: |
          set -eux

          rm -rf gcc64-src

          git clone \
            --depth=1 \
            --branch android-11.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            gcc64-src

          echo "Checking AArch64 GCC..."

          test -d gcc64-src/bin
          test -d gcc64-src/lib
          test -d gcc64-src/libexec

          test -x gcc64-src/bin/aarch64-linux-android-gcc
          test -x gcc64-src/bin/aarch64-linux-android-g++

          rm -rf "${GCC64_DIR}"
          mkdir -p "${GCC64_DIR}"

          cp -a gcc64-src/. "${GCC64_DIR}/"

          test -x "${GCC64_DIR}/bin/aarch64-linux-android-gcc"
          test -x "${GCC64_DIR}/bin/aarch64-linux-android-g++"

          echo "AArch64 GCC version:"
          "${GCC64_DIR}/bin/aarch64-linux-android-gcc" --version

      # ---------------------------------------------------------
      # Download ARM32 GCC 4.9
      # ---------------------------------------------------------
      - name: Download ARM32 GCC 4.9
        run: |
          set -eux

          rm -rf gcc32-src

          git clone \
            --depth=1 \
            --branch android-11.0.0_r1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            gcc32-src

          echo "Checking ARM32 GCC..."

          test -d gcc32-src/bin
          test -d gcc32-src/lib
          test -d gcc32-src/libexec

          test -x gcc32-src/bin/arm-linux-androideabi-gcc
          test -x gcc32-src/bin/arm-linux-androideabi-g++

          rm -rf "${GCC32_DIR}"
          mkdir -p "${GCC32_DIR}"

          cp -a gcc32-src/. "${GCC32_DIR}/"

          test -x "${GCC32_DIR}/bin/arm-linux-androideabi-gcc"
          test -x "${GCC32_DIR}/bin/arm-linux-androideabi-g++"

          echo "ARM32 GCC version:"
          "${GCC32_DIR}/bin/arm-linux-androideabi-gcc" --version

      # ---------------------------------------------------------
      # Configure PATH
      # ---------------------------------------------------------
      - name: Configure toolchain PATH
        run: |
          set -eux

          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"
          echo "${GCC64_DIR}/bin" >> "${GITHUB_PATH}"
          echo "${GCC32_DIR}/bin" >> "${GITHUB_PATH}"

          echo "PATH entries:"
          echo "${CLANG_DIR}/bin"
          echo "${GCC64_DIR}/bin"
          echo "${GCC32_DIR}/bin"

      # ---------------------------------------------------------
      # Verify complete toolchain
      # ---------------------------------------------------------
      - name: Verify toolchains
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          echo "========================================"
          echo "Clang"
          echo "========================================"

          command -v clang
          clang --version

          echo "========================================"
          echo "LLD"
          echo "========================================"

          command -v ld.lld
          ld.lld --version

          echo "========================================"
          echo "AArch64 GCC"
          echo "========================================"

          command -v aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

          echo "========================================"
          echo "ARM32 GCC"
          echo "========================================"

          command -v arm-linux-androideabi-gcc
          arm-linux-androideabi-gcc --version

          echo "========================================"
          echo "Toolchain files"
          echo "========================================"

          ls -lah "${CLANG_DIR}/bin/clang"
          ls -lah "${GCC64_DIR}/bin/aarch64-linux-android-gcc"
          ls -lah "${GCC32_DIR}/bin/arm-linux-androideabi-gcc"

      # ---------------------------------------------------------
      # Check kernel source
      # ---------------------------------------------------------
      - name: Check kernel source
        run: |
          set -eux

          echo "Kernel directory:"
          pwd

          echo "Kernel files:"
          ls -lah

          echo "Makefile:"
          test -f Makefile

          echo "Kconfig:"
          test -f Kconfig

          echo "Defconfig:"
          test -f "arch/arm64/configs/${DEFCONFIG}"

      # ---------------------------------------------------------
      # Generate base defconfig
      # ---------------------------------------------------------
      - name: Generate defconfig
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          make \
            O="${OUT_DIR}" \
            ARCH="${ARCH}" \
            "${DEFCONFIG}"

          echo "Generated config:"
          test -f "${OUT_DIR}/.config"

          echo "CONFIG size:"
          wc -l "${OUT_DIR}/.config"

      # ---------------------------------------------------------
      # Merge DroidSpaces configuration
      # ---------------------------------------------------------
      - name: Merge droidspaces.cfg
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          if [ -f droidspaces.cfg ]; then

            echo "Found droidspaces.cfg"

            scripts/kconfig/merge_config.sh \
              -O "${OUT_DIR}" \
              "${OUT_DIR}/.config" \
              droidspaces.cfg

            make \
              O="${OUT_DIR}" \
              ARCH="${ARCH}" \
              olddefconfig

          else

            echo "droidspaces.cfg not found."
            echo "Skipping config merge."

          fi

          echo "Final kernel config:"
          test -f "${OUT_DIR}/.config"

      # ---------------------------------------------------------
      # Show important configuration
      # ---------------------------------------------------------
      - name: Show kernel configuration
        run: |
          set -eux

          echo "========================================"
          echo "Kernel configuration"
          echo "========================================"

          grep -E \
            '^(CONFIG_ARM64|CONFIG_MODULES|CONFIG_KALLSYMS|CONFIG_LTO|CONFIG_CC_IS_CLANG|CONFIG_LD_IS_LLD|CONFIG_IKCONFIG)' \
            "${OUT_DIR}/.config" || true

      # ---------------------------------------------------------
      # Build kernel Image.gz
      #
      # LLVM_IAS is intentionally NOT enabled here.
      # First get a clean baseline build working.
      # ---------------------------------------------------------
      - name: Build Image.gz
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-"

          make \
            -j"$(nproc)" \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-" \
            Image.gz

          test -f "${OUT_DIR}/arch/arm64/boot/Image.gz"

          echo "Image.gz successfully built."

          ls -lh \
            "${OUT_DIR}/arch/arm64/boot/Image.gz"

      # ---------------------------------------------------------
      # Build DTBs
      # ---------------------------------------------------------
      - name: Build DTBs
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-"

          make \
            -j"$(nproc)" \
            O="${OUT_DIR}" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-" \
            dtbs

          echo "DTB files:"

          find "${OUT_DIR}/arch/arm64/boot/dts" \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -print || true

      # ---------------------------------------------------------
      # Build DTBO image
      # ---------------------------------------------------------
      - name: Build DTBO image
        run: |
          set -eux

          export PATH="${CLANG_DIR}/bin:${GCC64_DIR}/bin:${GCC32_DIR}/bin:${PATH}"

          if grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' "${OUT_DIR}/.config"; then

            echo "DT overlay support enabled."

            make \
              -j"$(nproc)" \
              O="${OUT_DIR}" \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE="${GCC64_DIR}/bin/aarch64-linux-android-" \
              CROSS_COMPILE_ARM32="${GCC32_DIR}/bin/arm-linux-androideabi-" \
              dtbo.img

          else

            echo "CONFIG_BUILD_ARM64_DT_OVERLAY is not enabled."
            echo "Skipping dtbo.img."

          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" ]; then
            ls -lh "${OUT_DIR}/arch/arm64/boot/dtbo.img"
          else
            echo "No dtbo.img generated."
          fi

      # ---------------------------------------------------------
      # Collect build artifacts
      # ---------------------------------------------------------
      - name: Prepare artifacts
        if: success()
        run: |
          set -eux

          rm -rf release
          mkdir -p release

          # Kernel
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp \
              "${OUT_DIR}/arch/arm64/boot/Image.gz" \
              release/Image.gz
          fi

          # Raw Image
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp \
              "${OUT_DIR}/arch/arm64/boot/Image" \
              release/Image
          fi

          # DTBO
          if [ -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" ]; then
            cp \
              "${OUT_DIR}/arch/arm64/boot/dtbo.img" \
              release/dtbo.img
          fi

          # DTBs
          mkdir -p release/dtb

          find "${OUT_DIR}/arch/arm64/boot/dts" \
            -type f \
            -name "*.dtb" \
            -exec cp {} release/dtb/ \; || true

          echo "========================================"
          echo "Release files"
          echo "========================================"

          find release \
            -type f \
            -exec ls -lh {} \;

      # ---------------------------------------------------------
      # Upload kernel artifacts
      # ---------------------------------------------------------
      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------
      # Upload full build output when compilation fails
      # ---------------------------------------------------------
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-failure-${{ github.sha }}
          path: |
            out/.config
            out/.config.old
            out/include/config/
            out/arch/arm64/boot/
          if-no-files-found: ignore
          retention-days: 7
