name: Build Kernel for judyln with Droidspaces

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: "Kernel defconfig"
        required: true
        default: "lineageos_judyln_defconfig"

      kernel_branch:
        description: "Kernel branch"
        required: true
        default: "lineage-22.2"

env:
  KERNEL_REPO: coldraintea/android_kernel_lge_sdm845
  KERNEL_BRANCH: ${{ inputs.kernel_branch }}
  CONFIG_NAME: ${{ inputs.config_name }}

  ARCH: arm64
  SUBARCH: arm64

  KERNEL_NAME: lineage-kernel-judyln

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # 1. Maximize build space
      # ============================================================
      - name: Maximize build space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /share

          df -h


      # ============================================================
      # 2. Checkout kernel
      # ============================================================
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive


      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            libelf-dev \
            dwarves \
            xz-utils \
            rsync \
            python3-distutils \
            python3 \
            git \
            make \
            gcc \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            device-tree-compiler \
            cpio \
            lz4 \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            curl \
            wget \
            unzip \
            zip \
            file

      # ============================================================
      # 4. Setup original working Clang 11
      # ============================================================
      - name: Setup Clang 11
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch 11 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            toolchain/clang

          chmod -R +x toolchain/clang/bin

          echo "===== CLANG ====="
          toolchain/clang/bin/clang --version

      # ============================================================
      # 5. Setup original working GCC 4.9
      # ============================================================
      - name: Setup GCC 4.9
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p toolchain

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            toolchain/gcc

          git clone \
            --depth=1 \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            toolchain/gcc32

          chmod -R +x toolchain/gcc/bin
          chmod -R +x toolchain/gcc32/bin

          echo "===== GCC64 ====="
          toolchain/gcc/bin/aarch64-linux-android-gcc --version

          echo "===== GCC32 ====="
          toolchain/gcc32/bin/arm-linux-androideabi-gcc --version


      # ============================================================
      # 6. Download latest official LineageOS boot.img
      # ============================================================
      - name: Download latest official LineageOS boot.img
        shell: bash
        run: |
          set -euo pipefail

          DEVICE="g710ulm"
          API="https://download.lineageos.org/api/v2/devices/${DEVICE}/builds"

          mkdir -p official

          echo "=========================================="
          echo " LineageOS official boot.img"
          echo "=========================================="

          echo
          echo "[1/4] Fetch build list..."

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 180 \
            -A "GitHubActions-LineageOS-Kernel" \
            "$API" \
            -o official/lineage-builds.json

          test -s official/lineage-builds.json

          echo
          echo "[2/4] Find newest build..."

          python3 <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("official/lineage-builds.json")

          with path.open("r", encoding="utf-8") as f:
              builds = json.load(f)

          if not builds:
              print("ERROR: LineageOS API returned no builds.")
              sys.exit(1)

          builds.sort(
              key=lambda x: int(x.get("datetime", 0)),
              reverse=True
          )

          latest = builds[0]

          latest_date = latest.get("date", "")
          latest_datetime = latest.get("datetime", 0)
          latest_version = latest.get("version", "")
          latest_type = latest.get("type", "")

          print("Latest build:")
          print("  date     :", latest_date)
          print("  datetime :", latest_datetime)
          print("  version  :", latest_version)
          print("  type     :", latest_type)

          boot = None

          for item in latest.get("files", []):
              if item.get("filename") == "boot.img":
                  boot = item
                  break

          if boot is None:
              print("ERROR: boot.img was not found.")
              sys.exit(1)

          filename = boot.get("filename", "")
          url = boot.get("url", "")
          sha256 = boot.get("sha256", "")
          size = int(boot.get("size", 0))

          if filename != "boot.img":
              print("ERROR: unexpected filename:", filename)
              sys.exit(1)

          if not url:
              print("ERROR: boot.img URL is empty.")
              sys.exit(1)

          if len(sha256) != 64:
              print("ERROR: invalid SHA256.")
              sys.exit(1)

          if size <= 0:
              print("ERROR: invalid boot.img size.")
              sys.exit(1)

          print()
          print("Official boot.img:")
          print("  filename :", filename)
          print("  url      :", url)
          print("  sha256   :", sha256)
          print("  size     :", size)

          with open("official/boot.env", "w", encoding="utf-8") as f:
              f.write(f"LINEAGE_DATE={latest_date}\n")
              f.write(f"LINEAGE_DATETIME={latest_datetime}\n")
              f.write(f"LINEAGE_VERSION={latest_version}\n")
              f.write(f"LINEAGE_TYPE={latest_type}\n")
              f.write(f"BOOT_URL={url}\n")
              f.write(f"BOOT_SHA256={sha256}\n")
              f.write(f"BOOT_SIZE={size}\n")
              f.write(f"BOOT_FILENAME={filename}\n")
          PY

          # Make variables available in THIS shell.
          set -a
          source official/boot.env
          set +a

          # Make variables available to FOLLOWING steps.
          cat official/boot.env >> "$GITHUB_ENV"

          echo
          echo "[3/4] Download boot.img..."

          curl -L \
            --fail \
            --retry 10 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            -A "GitHubActions-LineageOS-Kernel" \
            "$BOOT_URL" \
            -o official/boot.img

          test -s official/boot.img

          echo
          echo "[4/4] Verify boot.img..."

          ACTUAL_SIZE=$(stat -c%s official/boot.img)

          echo "Expected size: $BOOT_SIZE"
          echo "Actual size  : $ACTUAL_SIZE"

          if [ "$ACTUAL_SIZE" -ne "$BOOT_SIZE" ]; then
            echo "ERROR: boot.img size mismatch."
            exit 1
          fi

          ACTUAL_SHA256=$(sha256sum official/boot.img | awk '{print $1}')

          echo
          echo "Expected SHA256:"
          echo "$BOOT_SHA256"

          echo
          echo "Actual SHA256:"
          echo "$ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$BOOT_SHA256" ]; then
            echo
            echo "ERROR: boot.img SHA256 mismatch."
            exit 1
          fi

          echo
          echo "Official boot.img verified successfully."

          ls -lh official/boot.img
          file official/boot.img


      # ============================================================
      # 7. Prepare clean kernel source tree
      #
      # IMPORTANT:
      # This kernel Makefile refuses O=out builds when the source
      # tree already contains .config or include/config.
      # ============================================================
      - name: Clean kernel source tree for O=out
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          echo "===== SOURCE TREE CLEANUP ====="

          echo "Checking for tracked generated files..."

          if git ls-files --error-unmatch .config >/dev/null 2>&1; then
            echo "ERROR: .config is tracked in the repository."
            exit 1
          fi

          if git ls-files --error-unmatch include/config >/dev/null 2>&1; then
            echo "ERROR: include/config contains tracked files."
            git ls-files include/config
            exit 1
          fi

          echo "Removing old generated files..."

          rm -f .config
          rm -f .config.old
          rm -f .version

          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          rm -rf out

          echo
          echo "===== SOURCE TREE STATUS ====="

          if [ -f .config ]; then
            echo "ERROR: .config still exists."
            exit 1
          fi

          if [ -d include/config ]; then
            echo "ERROR: include/config still exists."
            exit 1
          fi

          git status --short

          echo
          echo "Source tree is ready for O=out build."


      # ============================================================
      # 8. Apply cgroup patch
      # ============================================================
      - name: Apply cgroup patch
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "02.fix_restore_cgroup_file_prefix_handling.patch" ]; then

            echo "===== CHECK CGROUP PATCH ====="

            git apply --check \
              02.fix_restore_cgroup_file_prefix_handling.patch

            echo "===== APPLY CGROUP PATCH ====="

            git apply \
              02.fix_restore_cgroup_file_prefix_handling.patch

          else
            echo "cgroup patch not found."
          fi


      # ============================================================
      # 9. VDSO32 dependency fix
      # ============================================================
      - name: Fix VDSO32 build dependency
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/Makefile")
          text = path.read_text()

          original = text

          # ----------------------------------------------------------
          # CROSS_COMPILE_COMPAT fallback
          # ----------------------------------------------------------
          if "CROSS_COMPILE_COMPAT" not in text:

              marker = "ifeq ($(KBUILD_EXTMOD),)"

              if marker in text:
                  text = text.replace(
                      marker,
                      "export CROSS_COMPILE_COMPAT ?= $(CROSS_COMPILE_ARM32)\n\n"
                      + marker,
                      1
                  )

          # ----------------------------------------------------------
          # Generate vdso32-offsets.h during prepare
          # ----------------------------------------------------------
          target = "include/generated/vdso32-offsets.h"

          if target not in text:

              lines = text.splitlines()
              insert_at = None

              for i, line in enumerate(lines):

                  if "include/generated/vdso-offsets.h" in line:
                      insert_at = i + 1
                      break

              if insert_at is not None:

                  block = [
                      "",
                      "ifdef CONFIG_COMPAT_VDSO",
                      "\t$(Q)$(MAKE) $(build)=arch/arm64/kernel/vdso32 include/generated/vdso32-offsets.h",
                      "endif",
                  ]

                  lines[insert_at:insert_at] = block
                  text = "\n".join(lines) + "\n"

          if text == original:
              print("VDSO32 patch already present.")
          else:
              path.write_text(text)
              print("VDSO32 dependency fix applied.")

          print()
          print("===== VDSO32 RELEVANT LINES =====")

          for i, line in enumerate(text.splitlines(), 1):

              if (
                  "CROSS_COMPILE_COMPAT" in line
                  or "vdso_prepare" in line
                  or "vdso-offsets" in line
                  or "vdso32-offsets" in line
              ):
                  print(f"{i}: {line}")
          PY


      # ============================================================
      # 10. Build kernel
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$PWD/toolchain/clang/bin:$PWD/toolchain/gcc/bin:$PWD/toolchain/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$PWD/toolchain/gcc/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$PWD/toolchain/gcc32/bin/arm-linux-androideabi-"
          export CROSS_COMPILE_COMPAT="$CROSS_COMPILE_ARM32"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1

          echo "=========================================="
          echo " TOOLCHAIN"
          echo "=========================================="

          which clang
          clang --version

          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CROSS_COMPILE_COMPAT=$CROSS_COMPILE_COMPAT"

          echo
          echo "=========================================="
          echo " SOURCE TREE CHECK"
          echo "=========================================="

          if [ -f .config ]; then
            echo "ERROR: source .config exists."
            exit 1
          fi

          if [ -d include/config ]; then
            echo "ERROR: source include/config exists."
            exit 1
          fi

          echo
          echo "=========================================="
          echo " DEFCONFIG"
          echo "=========================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            "$CONFIG_NAME"

          echo
          echo "=========================================="
          echo " MERGE DROIDSPACES CONFIG"
          echo "=========================================="

          if [ -f droidspaces.cfg ]; then

            ./scripts/kconfig/merge_config.sh \
              -m \
              out/.config \
              droidspaces.cfg

          else
            echo "droidspaces.cfg not found."
          fi

          echo
          echo "=========================================="
          echo " OLDDEFCONFIG"
          echo "=========================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          echo
          echo "=========================================="
          echo " CLEAN GENERATED SOURCE FILES"
          echo "=========================================="

          # This kernel tree requires the source tree itself to remain
          # free of generated configuration files when using O=out.
          # Some old Kbuild/Kconfig paths can recreate these directories
          # during *config targets, so clean them immediately before
          # prepare.

          rm -f .config
          rm -f .config.old
          rm -f .version

          rm -rf include/config
          rm -rf include/generated
          rm -rf arch/arm64/include/generated

          echo "Source generated files cleaned."
          echo
          echo "Source tree status after olddefconfig cleanup:"
          git status --short

          if [ -f .config ]; then
            echo "ERROR: source .config still exists."
            exit 1
          fi

          if [ -d include/config ]; then
            echo "ERROR: source include/config still exists."
            exit 1
          fi

          echo "Source tree is clean for PREPARE."

          echo
          echo "=========================================="
          echo " PREPARE"
          echo "=========================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            prepare

          echo
          echo "=========================================="
          echo " PREPARE"
          echo "=========================================="

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            prepare

          echo
          echo "=========================================="
          echo " VERIFY VDSO"
          echo "=========================================="

          test -f out/include/generated/vdso-offsets.h

          if grep -q '^CONFIG_COMPAT_VDSO=y' out/.config; then

            echo "CONFIG_COMPAT_VDSO=y"

            test -f \
              out/include/generated/vdso32-offsets.h

            echo "vdso32-offsets.h exists."

          else

            echo "CONFIG_COMPAT_VDSO is not enabled."

          fi

          echo
          echo "=========================================="
          echo " BUILD IMAGE.GZ"
          echo "=========================================="

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            Image.gz

          echo
          echo "=========================================="
          echo " KERNEL BUILD RESULT"
          echo "=========================================="

          test -s out/arch/arm64/boot/Image.gz

          ls -lh \
            out/arch/arm64/boot/Image.gz

          file \
            out/arch/arm64/boot/Image.gz


      

      # ============================================================
      # 11. Prepare magiskboot
      # ============================================================
      - name: Prepare magiskboot
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p boot-tools

          echo "Downloading latest Magisk..."

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk.apk \
            -o boot-tools/Magisk.apk

          echo "Extracting magiskboot..."

          unzip -j \
            boot-tools/Magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d boot-tools

          mv \
            boot-tools/libmagiskboot.so \
            boot-tools/magiskboot

          chmod +x \
            boot-tools/magiskboot

          echo
          echo "===== MAGISKBOOT ====="

          ls -lh \
            boot-tools/magiskboot


      # ============================================================
      # 12. Unpack official boot.img
      # ============================================================
      - name: Unpack official boot.img
        shell: bash
        run: |
          set -euo pipefail

          rm -rf boot-extracted

          mkdir -p boot-extracted

          cp \
            official/boot.img \
            boot-extracted/official-boot.img

          cd boot-extracted

          echo "=========================================="
          echo " UNPACK OFFICIAL BOOT"
          echo "=========================================="

          ../boot-tools/magiskboot \
            unpack \
            official-boot.img

          echo
          echo "===== EXTRACTED FILES ====="

          find . \
            -maxdepth 2 \
            -type f \
            -printf "%p %s bytes\n" \
            | sort

          if [ ! -f kernel ]; then

            echo
            echo "ERROR: magiskboot did not extract kernel."

            find . \
              -maxdepth 2 \
              -type f \
              -ls

            exit 1
          fi

          echo
          echo "===== ORIGINAL KERNEL ====="

          ls -lh kernel
          file kernel


      # ============================================================
      # 13. Replace kernel with Image.gz
      # ============================================================
      - name: Replace boot kernel with Image.gz
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " NEW KERNEL"
          echo "=========================================="

          test -s \
            kernel/out/arch/arm64/boot/Image.gz

          ls -lh \
            kernel/out/arch/arm64/boot/Image.gz

          file \
            kernel/out/arch/arm64/boot/Image.gz

          echo
          echo "=========================================="
          echo " REPLACE KERNEL"
          echo "=========================================="

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            boot-extracted/kernel

          echo
          echo "===== NEW BOOT KERNEL ====="

          ls -lh \
            boot-extracted/kernel

          file \
            boot-extracted/kernel


      # ============================================================
      # 14. Repack boot.img
      # ============================================================
      - name: Repack boot.img
        shell: bash
        run: |
          set -euo pipefail

          cd boot-extracted

          echo "=========================================="
          echo " REPACK BOOT"
          echo "=========================================="

          ../boot-tools/magiskboot \
            repack \
            official-boot.img

          if [ ! -f new-boot.img ]; then

            echo "ERROR: new-boot.img was not created."

            ls -lah

            exit 1
          fi

          test -s new-boot.img

          mv \
            new-boot.img \
            ../${KERNEL_NAME}.img

          cd ..

          echo
          echo "===== FINAL BOOT IMAGE ====="

          ls -lh \
            "${KERNEL_NAME}.img"

          file \
            "${KERNEL_NAME}.img"


      # ============================================================
      # 15. Validate final boot.img
      # ============================================================
      - name: Validate final boot.img
        shell: bash
        run: |
          set -euo pipefail

          test -s \
            "${KERNEL_NAME}.img"

          SIZE=$(stat -c%s \
            "${KERNEL_NAME}.img")

          echo "=========================================="
          echo " FINAL BOOT IMAGE"
          echo "=========================================="

          ls -lh \
            "${KERNEL_NAME}.img"

          file \
            "${KERNEL_NAME}.img"

          echo
          echo "Size:"
          echo "$SIZE bytes"

          echo
          echo "SHA256:"

          sha256sum \
            "${KERNEL_NAME}.img"

          echo
          echo "=========================================="
          echo " OFFICIAL LINEAGEOS BASE"
          echo "=========================================="

          echo "Version : $LINEAGE_VERSION"
          echo "Date    : $LINEAGE_DATE"
          echo "Type    : $LINEAGE_TYPE"
          echo "URL     : $BOOT_URL"
          echo "SHA256  : $BOOT_SHA256"
          echo "Size    : $BOOT_SIZE"


      # ============================================================
      # 16. Create release package
      # ============================================================
      - name: Create release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release

          mkdir -p release

          echo "===== PREPARE RELEASE FILES ====="

          cp \
            "${KERNEL_NAME}.img" \
            release/boot.img

          cp \
            kernel/out/arch/arm64/boot/Image.gz \
            release/Image.gz

          cp \
            official/boot.img \
            release/official-boot.img

          cp \
            official/lineage-builds.json \
            release/lineage-builds.json

          printf '%s\n' \
            'Kernel build for LG G7 ThinQ G710ULM / judyln' \
            '' \
            'Kernel repository:' \
            'https://github.com/coldraintea/android_kernel_lge_sdm845' \
            '' \
            'Kernel branch:' \
            "${KERNEL_BRANCH}" \
            '' \
            'Defconfig:' \
            "${CONFIG_NAME}" \
            '' \
            'LineageOS version:' \
            "${LINEAGE_VERSION}" \
            '' \
            'LineageOS build date:' \
            "${LINEAGE_DATE}" \
            '' \
            'LineageOS build type:' \
            "${LINEAGE_TYPE}" \
            '' \
            'Official LineageOS boot.img:' \
            "${BOOT_URL}" \
            '' \
            'Official boot.img SHA256:' \
            "${BOOT_SHA256}" \
            '' \
            'Official boot.img size:' \
            "${BOOT_SIZE}" \
            '' \
            'Files:' \
            '' \
            'boot.img' \
            'Repacked official LineageOS boot.img with newly compiled Image.gz.' \
            '' \
            'Image.gz' \
            'Newly compiled kernel.' \
            '' \
            'official-boot.img' \
            'Original official LineageOS boot.img used as packaging base.' \
            '' \
            'lineage-builds.json' \
            'Official LineageOS build API response.' \
            '' \
            'WARNING:' \
            'This kernel is for testing purposes.' \
            'Flash at your own risk.' \
            > release/README.txt

          echo
          echo "===== RELEASE DIRECTORY ====="

          ls -lah release

          echo
          echo "===== CREATE ZIP ====="

          cd release

          zip -9 \
            "../${KERNEL_NAME}.zip" \
            boot.img \
            Image.gz \
            official-boot.img \
            lineage-builds.json \
            README.txt

          cd ..

          echo
          echo "===== PACKAGE RESULT ====="

          test -s \
            "${KERNEL_NAME}.zip"

          test -s \
            "${KERNEL_NAME}.img"

          ls -lh \
            "${KERNEL_NAME}.zip" \
            "${KERNEL_NAME}.img"

          echo
          echo "===== SHA256 ====="

          sha256sum \
            "${KERNEL_NAME}.zip" \
            "${KERNEL_NAME}.img"


      # ============================================================
      # 17. Upload artifacts
      # ============================================================
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_NAME }}
          path: |
            ${{ env.KERNEL_NAME }}.zip
            ${{ env.KERNEL_NAME }}.img
            kernel/out/arch/arm64/boot/Image.gz
            official/boot.img
            release/
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # 18. Create GitHub Release
      # ============================================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.KERNEL_NAME }}-${{ github.run_number }}
          name: "${{ env.KERNEL_NAME }} build #${{ github.run_number }}"
          body: |
            ## LG G7 ThinQ G710ULM / judyln Kernel

            ### Kernel

            Repository:
            `coldraintea/android_kernel_lge_sdm845`

            Branch:
            `${{ env.KERNEL_BRANCH }}`

            Defconfig:
            `${{ env.CONFIG_NAME }}`

            ### Official LineageOS base

            Version:
            `${{ env.LINEAGE_VERSION }}`

            Build date:
            `${{ env.LINEAGE_DATE }}`

            Build type:
            `${{ env.LINEAGE_TYPE }}`

            Official boot.img:
            `${{ env.BOOT_URL }}`

            Official boot.img SHA256:
            `${{ env.BOOT_SHA256 }}`

            The official LineageOS boot.img was downloaded automatically
            and used as the packaging base.

            The newly compiled Image.gz was inserted into the boot image.

            ### Files

            - `${{ env.KERNEL_NAME }}.zip`
            - `${{ env.KERNEL_NAME }}.img`

            The `.img` file is the final repacked boot image.

            The ZIP contains:

            - `boot.img`
            - `Image.gz`
            - `official-boot.img`
            - `lineage-builds.json`
            - `README.txt`

            ### Warning

            Test/experimental kernel.
            Flash at your own risk.

          files: |
            ${{ env.KERNEL_NAME }}.zip
            ${{ env.KERNEL_NAME }}.img

          draft: false
          prerelease: false

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
