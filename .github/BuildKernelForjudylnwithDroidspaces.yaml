name: Build Kernel for judyln with Droidspaces

on:
  workflow_dispatch:
    inputs:
      config_name:
        description: 'Defconfig name'
        required: false
        default: 'lineageos_judyln_defconfig'
      kernel_branch:
        description: 'Kernel branch'
        required: false
        default: 'lineage-22.2'

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /share
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make gcc gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev \
            libncurses-dev device-tree-compiler \
            cpio python3 python3-dev \
            lz4 gcc-arm-linux-gnueabi \
            libelf-dev dwarves

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: coldraintea/android_kernel_lge_sdm845
          ref: ${{ github.event.inputs.kernel_branch || 'lineage-22.2' }}
          path: kernel

      - name: Setup toolchain (Clang)
        run: |
          mkdir -p toolchain
          git clone --depth=1 \
            https://gitlab.com/ThankYouMario/android_prebuilts_clang-standalone \
            toolchain/clang -b 17

      - name: Setup toolchain (GCC)
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            toolchain/gcc
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            toolchain/gcc32
            
      - name: Apply cgroup prefix handling patch
        working-directory: kernel
        run: |
          patch -p1 < 02.fix_restore_cgroup_file_prefix_handling.patch
          
      - name: Apply Droidspaces kernel config
        working-directory: kernel
        run: |
          # 生成配置片段
          cat > droidspaces.cfg << 'EOF'
          # 完全支持Droidspaces的内核配置
          # Copyright (C) 2026 ravindu644 <droidcasts@protonmail.com>
          
          # IPC 机制
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          
          # 核心命名空间支持
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          
          # Seccomp 支持
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          
          # 控制组支持
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          
          # 设备文件系统支持
          CONFIG_DEVTMPFS=y
          
          # Overlay 文件系统支持（易失模式必需）
          CONFIG_OVERLAY_FS=y
          
          # 启用 tmpfs 上的 xattr、posix acl 支持
          # 用于 NixOS 支持
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          
          # 固件加载支持
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          
          # Droidspaces 网络隔离支持 - NAT 模式和无网络模式
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          
          # 旧版兼容
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          
          # 在旧内核上禁用此选项以使互联网正常工作
          CONFIG_ANDROID_PARANOID_NETWORK=n
          
          # 修复 Docker unsafe procfs 错误
          CONFIG_USER_NS=y
          EOF

          # 合并到 defconfig（根据实际 defconfig 名称调整）
          DEFCONFIG="arch/arm64/configs/${{ github.event.inputs.config_name || 'lineageos_judyln_defconfig' }}"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "⚠️ Defconfig not found, trying to find one..."
            find arch/arm64/configs -name "*judyln*" -o -name "*g7*" | head -5
            # 如果找不到，尝试使用默认的 sdm845 defconfig
            DEFCONFIG="arch/arm64/configs/sdm845_defconfig"
          fi
          cat droidspaces.cfg >> "$DEFCONFIG"
          echo "✅ Droidspaces config appended to $DEFCONFIG"

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          DEFCONFIG="${{ github.event.inputs.config_name || 'lineageos_judyln_defconfig' }}"
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            DEFCONFIG="sdm845_defconfig"
          fi

          make O=out ARCH=arm64 $DEFCONFIG
          # 确保 Droidspaces 选项已启用（防止被覆盖）
          scripts/kconfig/merge_config.sh -O out out/.config droidspaces.cfg
          make O=out ARCH=arm64 olddefconfig

          # 编译内核（使用所有 CPU 核心）
          make -j$(nproc) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image.gz dtbo.img

      - name: Prepare artifacts
        working-directory: kernel
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image.gz artifacts/
          cp out/arch/arm64/boot/dtbo.img artifacts/ || true
          # 如果有 DTB 也打包
          cp out/arch/arm64/boot/dts/qcom/*.dtb artifacts/ 2>/dev/null || true
          # 保存内核配置
          cp out/.config artifacts/config
          # 生成 AnyKernel3 兼容的 zip（可选）
          echo "✅ Artifacts prepared in kernel/artifacts/"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-judyln-droidspaces
          path: kernel/artifacts/
          retention-days: 7

      - name: Create release package
        if: github.event_name == 'push' || github.ref_type == 'tag'
        working-directory: kernel/artifacts
        run: |
          zip -r ../kernel-judyln-droidspaces.zip .
          echo "✅ Release package created"

      - name: Upload to Release
        if: github.event_name == 'push' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          files: kernel/kernel-judyln-droidspaces.zip
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
